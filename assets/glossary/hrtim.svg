<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1020" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">HRTIM: timers sincronizados, resolução e meia ponte</title>
  <desc id="d">Estrutura do HRTIM do STM32H743 (timer mestre e timers A a E com os pinos na WeAct H743), três fases defasadas de 120 graus, comparação de resolução entre timer comum, HRTIM do H743 e HRTIM da G474 num conversor buck de 200 kHz e uma meia ponte com driver, tempo morto e proteção por entrada de falha.</desc>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
  <rect width="1000" height="1020" fill="#ffffff"/>
<text x="24" y="34" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">1 · SEIS TIMERS SINCRONIZADOS NUM SÓ PERIFÉRICO</text>
<rect x="24" y="50" width="440" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="44" y="70" width="400" height="50" rx="8" fill="#0f3b2e"/><text x="244.0" y="91.0" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">timer mestre</text><text x="244.0" y="111.0" font-size="11" font-weight="400" fill="#bbf7d0" text-anchor="middle">dá o ritmo e as fases</text>
<rect x="44" y="134" width="120" height="30" rx="6" fill="#334155"/><text x="104" y="154" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">timer A</text><path d="M166 149 H200" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/><text x="208" y="154" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start">CHA1 · CHA2: PC6 · PC7</text><rect x="44" y="170" width="120" height="30" rx="6" fill="#334155"/><text x="104" y="190" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">timer B</text><path d="M166 185 H200" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/><text x="208" y="190" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start">CHB1 · CHB2: PC8 · PA8</text><rect x="44" y="206" width="120" height="30" rx="6" fill="#16a34a"/><text x="104" y="226" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">timer C</text><path d="M166 221 H200" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/><text x="208" y="226" font-size="11.5" font-weight="800" fill="#16a34a" text-anchor="start">CHC1 · CHC2: PA9 · PA10</text><rect x="44" y="242" width="120" height="30" rx="6" fill="#334155"/><text x="104" y="262" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">timer D</text><path d="M166 257 H200" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/><text x="208" y="262" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start">CHD1 · CHD2: PA11 · PA12</text><rect x="44" y="278" width="120" height="30" rx="6" fill="#334155"/><text x="104" y="298" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">timer E</text><path d="M166 293 H200" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/><text x="208" y="298" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start">CHE1 · CHE2: sem pinos no LQFP100</text><text x="44" y="322" font-size="11" font-weight="700" fill="#16a34a" text-anchor="start">em verde: o único par livre nos headers da WeAct H743</text><rect x="484" y="50" width="492" height="280" rx="10" fill="#fffbeb" stroke="#f1d58a"/>
<text x="504" y="78" font-size="12.5" font-weight="800" fill="#1e293b" text-anchor="start">Três fases defasadas de 120° (conversor intercalado)</text><path d="M560 140 H560.0 V118 H620.0 V140 H710.0 V118 H770.0 V140 H860.0 V118 H920.0 V140 H950.0" fill="none" stroke="#1d4ed8" stroke-width="2.2"/><text x="504" y="134" font-size="11.5" font-weight="800" fill="#1d4ed8" text-anchor="start">timer A</text><path d="M560 202 H610.0 V180 H670.0 V202 H760.0 V180 H820.0 V202 H910.0 V180 H950.0 V202 H950.0" fill="none" stroke="#7c3aed" stroke-width="2.2"/><text x="504" y="196" font-size="11.5" font-weight="800" fill="#7c3aed" text-anchor="start">timer B</text><path d="M560 264 H660.0 V242 H720.0 V264 H810.0 V242 H870.0 V264 H950.0" fill="none" stroke="#16a34a" stroke-width="2.2"/><text x="504" y="258" font-size="11.5" font-weight="800" fill="#16a34a" text-anchor="start">timer C</text><text x="504" y="312" font-size="11" font-weight="400" fill="#475569" text-anchor="start">mesma frequência, fases diferentes: a ondulação somada cai</text><text x="24" y="372" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">2 · RESOLUÇÃO: O QUE 2,1 ns SIGNIFICA NUMA FONTE CHAVEADA</text>
<rect x="24" y="388" width="952" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="44" y="416" font-size="12.5" font-weight="800" fill="#1e293b" text-anchor="start">Conversor buck a 200 kHz (período de 5 µs), entrada de 12 V: V_saída = duty × 12 V</text><text x="44" y="464" font-size="12" font-weight="800" fill="#475569" text-anchor="start">timer comum a 240 MHz</text><text x="44" y="482" font-size="11" font-weight="400" fill="#475569" text-anchor="start">passo 4,17 ns · 1.200 passos por período</text><rect x="330" y="450" width="278" height="26" rx="4" fill="#475569"/><text x="615.7694724999749" y="468" font-size="12" font-weight="800" fill="#475569" text-anchor="start">≈ 10,2 bits · degrau de 10 mV</text><text x="44" y="520" font-size="12" font-weight="800" fill="#b45309" text-anchor="start">HRTIM do H743 (480 MHz)</text><text x="44" y="538" font-size="11" font-weight="400" fill="#475569" text-anchor="start">passo 2,08 ns · 2.400 passos por período</text><rect x="330" y="506" width="305" height="26" rx="4" fill="#b45309"/><text x="642.9250493954835" y="524" font-size="12" font-weight="800" fill="#b45309" text-anchor="start">≈ 11,2 bits · degrau de 5 mV</text><text x="44" y="576" font-size="12" font-weight="800" fill="#16a34a" text-anchor="start">HRTIM da G474 (184 ps)</text><text x="44" y="594" font-size="11" font-weight="400" fill="#475569" text-anchor="start">passo 0,184 ns · 27.174 passos por período</text><rect x="330" y="562" width="400" height="26" rx="4" fill="#16a34a"/><text x="738.0" y="580" font-size="12" font-weight="800" fill="#16a34a" text-anchor="start">≈ 14,7 bits · degrau de 0,44 mV</text><text x="44" y="622" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="start">Degrau menor = tensão ou corrente ajustada mais fino, sem precisar baixar a frequência de chaveamento.</text><text x="24" y="680" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">3 · MEIA PONTE COM PROTEÇÃO POR HARDWARE</text>
<rect x="24" y="696" width="952" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="44" y="730" width="120" height="110" rx="8" fill="#0f3b2e"/><text x="104.0" y="781.0" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">HRTIM</text><text x="104.0" y="801.0" font-size="11" font-weight="400" fill="#bbf7d0" text-anchor="middle">timer C</text>
<rect x="234" y="730" width="120" height="110" rx="8" fill="#334155"/><text x="294.0" y="773.0" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">driver</text><text x="294.0" y="793.0" font-size="11" font-weight="400" fill="#cbd5e1" text-anchor="middle">meia ponte</text><text x="294.0" y="809.0" font-size="11" font-weight="400" fill="#cbd5e1" text-anchor="middle">(ex.: IR2110)</text>
<path d="M164 760 H232" fill="none" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#ar)"/><text x="198" y="752" font-size="10.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">PA9</text><path d="M164 810 H232" fill="none" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#ar)"/><text x="198" y="802" font-size="10.5" font-weight="800" fill="#7c3aed" text-anchor="middle">PA10</text><rect x="424" y="716" width="110" height="60" rx="8" fill="#475569"/><text x="479.0" y="742.0" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">MOSFET</text><text x="479.0" y="762.0" font-size="11" font-weight="400" fill="#e2e8f0" text-anchor="middle">de cima</text>
<rect x="424" y="800" width="110" height="60" rx="8" fill="#475569"/><text x="479.0" y="826.0" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">MOSFET</text><text x="479.0" y="846.0" font-size="11" font-weight="400" fill="#e2e8f0" text-anchor="middle">de baixo</text>
<path d="M354 760 H422" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/><path d="M354 810 H422" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/><path d="M534 788 H604" stroke="#475569" stroke-width="2.4"/><path d="M604 788 q10 -14 20 0 q10 -14 20 0 q10 -14 20 0 q10 -14 20 0" fill="none" stroke="#475569" stroke-width="2.4"/><text x="644" y="770" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">indutor</text><path d="M684 788 H740" stroke="#475569" stroke-width="2.4"/><rect x="740" y="752" width="100" height="72" rx="8" fill="#64748b"/><text x="790.0" y="784.0" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">carga</text><text x="790.0" y="804.0" font-size="11" font-weight="400" fill="#f1f5f9" text-anchor="middle">saída DC</text>
<path d="M479 860 V878 H566" fill="none" stroke="#475569" stroke-width="2"/><rect x="566" y="869" width="60" height="18" rx="3" fill="#fff" stroke="#b91c1c" stroke-width="1.6"/><text x="596" y="882" font-size="10" font-weight="700" fill="#b91c1c" text-anchor="middle">shunt</text><path d="M626 878 H660 V896 H104 V842" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="5 4"/><text x="680" y="900" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="start">sobrecorrente → comparador → FLT1 (PA15):</text><text x="680" y="915" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="start">saídas desligam em nanossegundos</text><text x="856" y="742" font-size="11" font-weight="700" fill="#1e293b" text-anchor="start">Tempo morto e o</text><text x="856" y="758" font-size="11" font-weight="400" fill="#1e293b" text-anchor="start">disparo do ADC no</text><text x="856" y="774" font-size="11" font-weight="400" fill="#1e293b" text-anchor="start">meio do pulso</text><text x="856" y="790" font-size="11" font-weight="400" fill="#1e293b" text-anchor="start">(corrente sem ruído)</text><text x="856" y="816" font-size="11" font-weight="400" fill="#475569" text-anchor="start">se configuram no</text><text x="856" y="832" font-size="11" font-weight="400" fill="#475569" text-anchor="start">próprio HRTIM.</text><g transform="translate(24 940)"><rect width="952" height="64" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/><text x="18" y="27" font-size="14" font-weight="800" fill="#14532d" text-anchor="start">Cuidado</text><text x="18" y="50" font-size="13" font-weight="400" fill="#1e293b" text-anchor="start">Potência é perigosa: teste com fonte limitada em corrente e carga resistiva antes de ligar indutores, baterias ou rede elétrica.</text></g>
</svg>
