<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 930" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">SysTick: o tick de 1 ms do Cortex-M</title>
  <desc id="d">Contador SysTick de 24 bits descendo e gerando a interrupção de 1 ms, funções que dependem do tick (HAL_GetTick, HAL_Delay, timeouts e RTOS), medição de tempo e tabela de valores de recarga para as placas STM32 do acervo.</desc>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
  <rect width="1000" height="930" fill="#ffffff"/>
<text x="24" y="34" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">1 · O RELÓGIO DE 1 ms DO PROGRAMA</text>
<rect x="24" y="50" width="952" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="44" y="84" font-size="11" font-weight="700" fill="#475569" text-anchor="start">LOAD</text><text x="44" y="194" font-size="11" font-weight="700" fill="#475569" text-anchor="start">0</text><text x="36" y="140" font-size="11" font-weight="800" fill="#1e293b" text-anchor="start">VAL</text><path d="M110 80 L300 190 V80 L490 190 V80 L680 190 V80" fill="none" stroke="#1d4ed8" stroke-width="2.4"/><circle cx="300" cy="190" r="5" fill="#b45309"/><text x="300" y="212" font-size="11" font-weight="800" fill="#b45309" text-anchor="middle">tick = 1</text><circle cx="490" cy="190" r="5" fill="#b45309"/><text x="490" y="212" font-size="11" font-weight="800" fill="#b45309" text-anchor="middle">tick = 2</text><circle cx="680" cy="190" r="5" fill="#b45309"/><text x="680" y="212" font-size="11" font-weight="800" fill="#b45309" text-anchor="middle">tick = 3</text><path d="M110 236 H300" fill="none" stroke="#475569" stroke-width="1.4" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="205.0" y="252" font-size="11.5" font-weight="800" fill="#475569" text-anchor="middle">1 ms</text><rect x="728" y="210" width="230" height="72" rx="8" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="740" y="232" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="start">a cada chegada a 0:</text><text x="740" y="252" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">SysTick_Handler() → uwTick++</text><text x="740" y="270" font-size="11" font-weight="400" fill="#475569" text-anchor="start">e o contador recarrega sozinho</text><text x="44" y="282" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="start">contador de 24 bits dentro do núcleo Cortex-M, descendo no clock da CPU</text><text x="24" y="342" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">2 · QUEM DEPENDE DESSE TICK</text>
<rect x="24" y="358" width="952" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="44" y="390" width="150" height="130" rx="8" fill="#b45309"/><text x="119.0" y="443.0" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">SysTick</text><text x="119.0" y="463.0" font-size="11" font-weight="400" fill="#fef3c7" text-anchor="middle">interrupção</text><text x="119.0" y="479.0" font-size="11" font-weight="400" fill="#fef3c7" text-anchor="middle">a cada 1 ms</text>
<path d="M194 455 C 240 455, 240 394, 290 394" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ar)"/><rect x="292" y="376" width="300" height="36" rx="6" fill="#fff" stroke="#1d4ed8" stroke-width="2"/><text x="306" y="392" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="start">HAL_GetTick()</text><text x="306" y="406" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">tempo desde o boot, em ms</text><path d="M194 455 C 240 455, 240 438, 290 438" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ar)"/><rect x="292" y="420" width="300" height="36" rx="6" fill="#fff" stroke="#1d4ed8" stroke-width="2"/><text x="306" y="436" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="start">HAL_Delay(n)</text><text x="306" y="450" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">espera comparando ticks</text><path d="M194 455 C 240 455, 240 482, 290 482" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#ar)"/><rect x="292" y="464" width="300" height="36" rx="6" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="306" y="480" font-size="12" font-weight="800" fill="#7c3aed" text-anchor="start">timeouts da HAL</text><text x="306" y="494" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">UART, I2C, SPI desistem a tempo</text><path d="M194 455 C 240 455, 240 526, 290 526" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#ar)"/><rect x="292" y="508" width="300" height="36" rx="6" fill="#fff" stroke="#16a34a" stroke-width="2"/><text x="306" y="524" font-size="12" font-weight="800" fill="#16a34a" text-anchor="start">FreeRTOS / RTOS</text><text x="306" y="538" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">troca de tarefa a cada tick</text><text x="620" y="392" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">Medir tempo de um trecho:</text><text x="620" y="414" font-size="12" font-weight="700" fill="#0f766e" text-anchor="start" font-family="DejaVu Sans Mono">t0 = HAL_GetTick();</text><text x="620" y="432" font-size="12" font-weight="700" fill="#0f766e" text-anchor="start" font-family="DejaVu Sans Mono">faz_algo();</text><text x="620" y="450" font-size="12" font-weight="700" fill="#0f766e" text-anchor="start" font-family="DejaVu Sans Mono">dt = HAL_GetTick() - t0;</text><text x="620" y="478" font-size="11" font-weight="400" fill="#475569" text-anchor="start">a subtração sem sinal funciona mesmo</text><text x="620" y="494" font-size="11" font-weight="400" fill="#475569" text-anchor="start">quando o contador de 32 bits dá a volta</text><text x="620" y="520" font-size="11" font-weight="400" fill="#475569" text-anchor="start">para microssegundos: contador de ciclos</text><text x="620" y="536" font-size="11" font-weight="400" fill="#475569" text-anchor="start">DWT-&gt;CYCCNT ou um timer de 32 bits</text><text x="24" y="600" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">3 · AS CONTAS NAS PLACAS DO ACERVO (TICK DE 1 ms)</text>
<rect x="24" y="616" width="952" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="44" y="644" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">Placa</text><text x="264" y="644" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">Clock da CPU</text><text x="414" y="644" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">LOAD = f ÷ 1000 − 1</text><text x="654" y="644" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">Período máximo (24 bits)</text><text x="44" y="670" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">WeAct H743</text><text x="264" y="670" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">480 MHz</text><text x="414" y="670" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">479 999</text><text x="654" y="670" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">≈ 34,9 ms</text><text x="44" y="696" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">WeAct H7R3</text><text x="264" y="696" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">600 MHz</text><text x="414" y="696" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">599 999</text><text x="654" y="696" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">≈ 28,0 ms</text><text x="44" y="722" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">WeAct G474</text><text x="264" y="722" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">170 MHz</text><text x="414" y="722" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">169 999</text><text x="654" y="722" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">≈ 98,7 ms</text><text x="44" y="748" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">BlackPill F411 (TCC)</text><text x="264" y="748" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">96 MHz</text><text x="414" y="748" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">95 999</text><text x="654" y="748" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">≈ 174,8 ms</text><text x="44" y="774" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">BluePill F103</text><text x="264" y="774" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">72 MHz</text><text x="414" y="774" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">71 999</text><text x="654" y="774" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">≈ 233,0 ms</text>
<text x="44" y="802" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="start">LOAD cabe em 24 bits (até 16 777 215). Arduino Uno e Nano não têm SysTick: millis() usa o Timer0 do ATmega328P.</text><g transform="translate(24 832)"><rect width="952" height="86" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/><text x="18" y="27" font-size="14" font-weight="800" fill="#14532d" text-anchor="start">Cuidados</text><text x="18" y="50" font-size="13" font-weight="400" fill="#1e293b" text-anchor="start">HAL_Delay() dentro de uma interrupção de prioridade igual ou maior que a do SysTick trava: o tick nunca avança.</text><text x="18" y="70" font-size="13" font-weight="400" fill="#1e293b" text-anchor="start">Com FreeRTOS, o RTOS fica com o SysTick e a HAL passa a usar outro timer (TIM6 é a escolha comum no CubeMX).</text></g>
</svg>
