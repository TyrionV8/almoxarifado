<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 960" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Watchdog: reinício automático, IWDG e WWDG</title>
  <desc id="d">Contador do watchdog sendo alimentado pelo programa até um travamento causar reset, comparação entre IWDG independente e WWDG com janela no STM32H743 com prazos e fórmulas, e boas práticas de uso.</desc>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
  <rect width="1000" height="960" fill="#ffffff"/>
<text x="24" y="34" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">1 · A IDEIA: SE O PROGRAMA PARAR DE &quot;ALIMENTAR&quot;, O CHIP REINICIA</text>
<rect x="24" y="50" width="952" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="44" y="84" font-size="11" font-weight="700" fill="#475569" text-anchor="start">cheio</text><text x="44" y="234" font-size="11" font-weight="700" fill="#475569" text-anchor="start">0</text><text x="40" y="150" font-size="11" font-weight="800" fill="#1e293b" text-anchor="start">contador</text><path d="M90 80 L240 150 V80 L380 145 V80 L530 150 V80 L730 230" fill="none" stroke="#1d4ed8" stroke-width="2.6"/><circle cx="240" cy="80" r="5" fill="#16a34a"/><text x="240" y="70" font-size="10.5" font-weight="800" fill="#16a34a" text-anchor="middle">alimenta</text><circle cx="380" cy="80" r="5" fill="#16a34a"/><text x="380" y="70" font-size="10.5" font-weight="800" fill="#16a34a" text-anchor="middle">alimenta</text><circle cx="530" cy="80" r="5" fill="#16a34a"/><text x="530" y="70" font-size="10.5" font-weight="800" fill="#16a34a" text-anchor="middle">alimenta</text><rect x="530" y="86" width="200" height="40" rx="6" fill="#fee2e2"/><text x="630" y="104" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">programa travou</text><text x="630" y="120" font-size="10.5" font-weight="400" fill="#b91c1c" text-anchor="middle">(laço infinito, espera eterna)</text><circle cx="730" cy="230" r="7" fill="#b91c1c"/><text x="742" y="234" font-size="13" font-weight="800" fill="#b91c1c" text-anchor="start">chegou a 0 → RESET</text><text x="742" y="252" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="start">o chip reinicia sozinho</text><text x="500" y="282" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">&quot;Alimentar&quot; = escrever uma chave no registrador, que recarrega o contador. Só um programa vivo consegue fazer isso a tempo.</text><text x="24" y="342" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">2 · OS DOIS WATCHDOGS DO STM32H743</text>
<rect x="24" y="358" width="466" height="290" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="40" y="386" font-size="17" font-weight="800" fill="#1e293b" text-anchor="start">IWDG · independente</text>
<text x="44" y="390" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start"></text><text x="184" y="390" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start"></text><text x="44" y="416" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">clock</text><text x="184" y="416" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">LSI interno, ~32 kHz (não o cristal)</text><text x="44" y="442" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">contador</text><text x="184" y="442" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">12 bits + prescaler /4 a /256</text><text x="44" y="468" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">prazo</text><text x="184" y="468" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">de ~0,125 ms até ~32,8 s</text><text x="44" y="494" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">Stop/Standby</text><text x="184" y="494" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">continua contando</text><text x="44" y="520" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">depois de ligado</text><text x="184" y="520" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">não pode ser desligado</text>
<text x="44" y="562" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">prazo = 4 × 2ᴾᴿ × (RL + 1) ÷ 32 kHz</text><text x="44" y="584" font-size="12" font-weight="700" fill="#b45309" text-anchor="start">ex.: /64 e RL = 999 → 2 s</text><text x="44" y="612" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Pega travamentos, falha do clock principal</text><text x="44" y="628" font-size="11" font-weight="400" fill="#475569" text-anchor="start">e laços que não voltam.</text><rect x="510" y="358" width="466" height="290" rx="10" fill="#fffbeb" stroke="#f1d58a"/><text x="526" y="386" font-size="17" font-weight="800" fill="#1e293b" text-anchor="start">WWDG · com janela</text>
<rect x="530" y="420" width="147.0" height="36" rx="4" fill="#fee2e2" stroke="#b91c1c"/><text x="603.5" y="442" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="middle">cedo demais: reset</text><rect x="677.0" y="420" width="210.0" height="36" rx="4" fill="#dcfce7" stroke="#16a34a"/><text x="782.0" y="442" font-size="11" font-weight="800" fill="#16a34a" text-anchor="middle">janela: pode alimentar</text><rect x="887.0" y="420" width="63.0" height="36" rx="4" fill="#fee2e2" stroke="#b91c1c"/><text x="918.5" y="442" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="middle">reset</text><text x="530" y="474" font-size="10.5" font-weight="700" fill="#475569" text-anchor="start">0x7F</text><text x="677.0" y="474" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">W</text><text x="887.0" y="474" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">0x40</text><path d="M530 490 H950" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ar)"/><text x="950" y="508" font-size="10.5" font-weight="400" fill="#475569" text-anchor="end">contador descendo →</text><text x="887.0" y="412" font-size="10.5" font-weight="800" fill="#b45309" text-anchor="middle">aviso (EWI)</text><text x="530" y="526" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start"></text><text x="650" y="526" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start"></text><text x="530" y="550" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">clock</text><text x="650" y="550" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">barramento APB ÷ 4096 ÷ 2ᵂᴰᴳᵀᴮ</text><text x="530" y="574" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">contador</text><text x="650" y="574" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">7 bits; reset abaixo de 0x40</text><text x="530" y="598" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">prazo típico</text><text x="650" y="598" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">dezenas de µs até ~280 ms</text>
<text x="530" y="632" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Pega também o programa rápido demais (laço pulando etapas).</text><text x="24" y="690" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">3 · COMO USAR SEM SE ENGANAR</text>
<rect x="24" y="706" width="952" height="160" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="44" y="732" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="start">1.</text><text x="64" y="732" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start">Alimente no laço principal, depois de conferir que cada tarefa deu sinal de vida — nunca numa interrupção de timer, que continua</text><text x="64" y="747" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start">rodando com o programa travado.</text><text x="44" y="766" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="start">2.</text><text x="64" y="766" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start">Escolha o prazo maior que o pior caso normal (gravar Flash, montar o cartão SD) e menor que o tempo tolerável sem resposta.</text><text x="44" y="800" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="start">3.</text><text x="64" y="800" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start">Na inicialização, leia a causa do reset (registrador RCC_RSR) e registre quando foi o watchdog: é a pista do travamento.</text><text x="44" y="834" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="start">4.</text><text x="64" y="834" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start">Na depuração, congele os watchdogs (registrador DBGMCU) para o chip não reiniciar parado num breakpoint.</text><g transform="translate(24 882)"><rect width="952" height="64" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/><text x="18" y="27" font-size="14" font-weight="800" fill="#14532d" text-anchor="start">O watchdog não conserta o erro</text><text x="18" y="50" font-size="13" font-weight="400" fill="#1e293b" text-anchor="start">Ele só tira o sistema de um estado travado. A causa do travamento continua lá: use o reset como aviso e investigue.</text></g>
</svg>
