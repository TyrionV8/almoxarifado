<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Timer: blocos, captura, encoder e disparo</title>
  <desc id="d">Diagrama interno de um timer do STM32H743 (clock, prescaler, contador, ARR, evento de atualização e canais de captura e comparação), medição de frequência por captura, leitura de encoder em quadratura, disparo do ADC por timer com DMA e tabela dos timers do H743.</desc>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
  <rect width="1000" height="1000" fill="#ffffff"/>
<text x="24" y="34" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">1 · POR DENTRO DE UM TIMER</text>
<rect x="24" y="50" width="952" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="44" y="90" width="120" height="70" rx="8" fill="#334155"/><text x="104.0" y="121.0" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">clock</text><text x="104.0" y="141.0" font-size="11" font-weight="400" fill="#cbd5e1" text-anchor="middle">até 240 MHz</text>
<rect x="194" y="90" width="120" height="70" rx="8" fill="#b45309"/><text x="254.0" y="121.0" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">PSC</text><text x="254.0" y="141.0" font-size="11" font-weight="400" fill="#fef3c7" text-anchor="middle">divide o clock</text>
<rect x="344" y="90" width="150" height="70" rx="8" fill="#0f3b2e"/><text x="419.0" y="121.0" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">CNT</text><text x="419.0" y="141.0" font-size="11" font-weight="400" fill="#bbf7d0" text-anchor="middle">conta 0 … ARR</text>
<rect x="524" y="90" width="120" height="70" rx="8" fill="#475569"/><text x="584.0" y="121.0" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">ARR</text><text x="584.0" y="141.0" font-size="11" font-weight="400" fill="#e2e8f0" text-anchor="middle">fim do período</text>
<path d="M164 125 H192" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#ar)"/><path d="M314 125 H342" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#ar)"/><path d="M494 125 H522" fill="none" stroke="#475569" stroke-width="2.4" marker-start="url(#ar)" marker-end="url(#ar)"/><path d="M644 125 H700" fill="none" stroke="#16a34a" stroke-width="2.4" marker-end="url(#ar)"/><rect x="702" y="70" width="254" height="110" rx="8" fill="#16a34a"/><text x="829.0" y="105.0" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">evento de atualização</text><text x="829.0" y="125.0" font-size="11" font-weight="400" fill="#dcfce7" text-anchor="middle">interrupção ou DMA</text><text x="829.0" y="141.0" font-size="11" font-weight="400" fill="#dcfce7" text-anchor="middle">TRGO: dispara ADC, DAC,</text><text x="829.0" y="157.0" font-size="11" font-weight="400" fill="#dcfce7" text-anchor="middle">outro timer</text>
<path d="M419 160 V196" stroke="#475569" stroke-width="2"/><rect x="224" y="196" width="400" height="84" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="424" y="218" font-size="12.5" font-weight="800" fill="#7c3aed" text-anchor="middle">canais CH1–CH4 (captura / comparação)</text><text x="240" y="242" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start">captura: uma borda no pino copia CNT → CCR (mede tempo)</text><text x="240" y="262" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start">comparação: CNT = CCR → muda o pino, PWM ou interrupção</text><text x="700" y="212" font-size="11.5" font-weight="800" fill="#1e293b" text-anchor="start">período do evento =</text><text x="700" y="230" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start">(PSC + 1) × (ARR + 1) ÷ f_clock</text><text x="700" y="256" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="start">240 MHz, PSC 23 999, ARR 9</text><text x="700" y="274" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="start">→ 1 interrupção por ms</text><text x="24" y="342" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">2 · TRÊS USOS ALÉM DO PWM</text>
<rect x="24" y="358" width="300" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="40" y="386" font-size="17" font-weight="800" fill="#1e293b" text-anchor="start">Medir frequência</text>
<path d="M44 460 H84 V420 H144 V460 H204 V420 H264 V460 H304" fill="none" stroke="#0f172a" stroke-width="2.2"/><path d="M84 410 V480" stroke="#7c3aed" stroke-dasharray="3 3"/><text x="84" y="498" font-size="10.5" font-weight="800" fill="#7c3aed" text-anchor="middle">CCR = 1200</text><path d="M204 410 V480" stroke="#7c3aed" stroke-dasharray="3 3"/><text x="204" y="498" font-size="10.5" font-weight="800" fill="#7c3aed" text-anchor="middle">CCR = 3600</text><path d="M86 520 H202" fill="none" stroke="#b45309" stroke-width="1.6" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="144" y="540" font-size="11" font-weight="800" fill="#b45309" text-anchor="middle">2400 contagens</text><text x="44" y="572" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start">contador a 1 MHz: período =</text><text x="44" y="590" font-size="11.5" font-weight="800" fill="#1e293b" text-anchor="start">2400 µs → 416,7 Hz</text><text x="44" y="616" font-size="11" font-weight="400" fill="#475569" text-anchor="start">captura por hardware: sem atraso</text><text x="44" y="630" font-size="11" font-weight="400" fill="#475569" text-anchor="start">de interrupção no instante medido</text><rect x="344" y="358" width="312" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="360" y="386" font-size="17" font-weight="800" fill="#1e293b" text-anchor="start">Ler encoder de motor</text>
<path d="M364 430 H394 V400 H454 V430 H514 V400 H574 V430 H634" fill="none" stroke="#1d4ed8" stroke-width="2.2"/><path d="M364 480 H424 V450 H484 V480 H544 V450 H604 V480 H634" fill="none" stroke="#0f766e" stroke-width="2.2"/><text x="356" y="396" font-size="11" font-weight="800" fill="#1d4ed8" text-anchor="start">A</text><text x="356" y="446" font-size="11" font-weight="800" fill="#0f766e" text-anchor="start">B</text><text x="364" y="512" font-size="11.5" font-weight="800" fill="#1e293b" text-anchor="start">A adiantado de B → CNT sobe</text><text x="364" y="530" font-size="11.5" font-weight="800" fill="#1e293b" text-anchor="start">B adiantado de A → CNT desce</text><text x="364" y="556" font-size="11" font-weight="400" fill="#475569" text-anchor="start">conta as 4 bordas por ciclo (×4) sem</text><text x="364" y="572" font-size="11" font-weight="400" fill="#475569" text-anchor="start">nenhuma interrupção: o CNT já é a posição</text><text x="364" y="600" font-size="11" font-weight="400" fill="#475569" text-anchor="start">TIM1–TIM5 e TIM8; nos de 32 bits</text><text x="364" y="616" font-size="11" font-weight="400" fill="#475569" text-anchor="start">(TIM2, TIM5) quase nunca estoura</text><rect x="676" y="358" width="300" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="692" y="386" font-size="17" font-weight="800" fill="#1e293b" text-anchor="start">Ritmo exato para o ADC</text>
<rect x="696" y="406" width="110" height="60" rx="8" fill="#b45309"/><text x="751.0" y="432.0" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">TIM6</text><text x="751.0" y="452.0" font-size="11" font-weight="400" fill="#fef3c7" text-anchor="middle">TRGO 48 kHz</text>
<rect x="846" y="406" width="110" height="60" rx="8" fill="#0f3b2e"/><text x="901.0" y="432.0" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">ADC</text><text x="901.0" y="452.0" font-size="11" font-weight="400" fill="#bbf7d0" text-anchor="middle">1 conversão</text>
<path d="M806 436 H844" fill="none" stroke="#b45309" stroke-width="2.4" marker-end="url(#ar)"/><rect x="846" y="496" width="110" height="60" rx="8" fill="#1d4ed8"/><text x="901.0" y="522.0" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">DMA</text><text x="901.0" y="542.0" font-size="11" font-weight="400" fill="#dbeafe" text-anchor="middle">→ buffer</text>
<path d="M901 466 V494" fill="none" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#ar)"/><text x="696" y="586" font-size="11" font-weight="400" fill="#1e293b" text-anchor="start">o intervalo entre amostras vem do</text><text x="696" y="602" font-size="11" font-weight="400" fill="#1e293b" text-anchor="start">hardware, não do código: sem jitter</text><text x="696" y="626" font-size="11" font-weight="400" fill="#475569" text-anchor="start">TIM6/TIM7 são &quot;básicos&quot;: só isso</text><text x="24" y="680" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">3 · OS TIMERS DO STM32H743 (DS12110, TABELA 5)</text>
<rect x="24" y="696" width="952" height="210" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="44" y="724" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">Tipo</text><text x="194" y="724" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">Timers</text><text x="344" y="724" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">Bits</text><text x="404" y="724" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">Canais</text><text x="574" y="724" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">Uso típico</text><text x="44" y="748" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">avançados</text><text x="194" y="748" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">TIM1, TIM8</text><text x="344" y="748" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">16</text><text x="404" y="748" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">4 + complementares</text><text x="574" y="748" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">motores, pontes, tempo morto</text><text x="44" y="772" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">gerais 32 bits</text><text x="194" y="772" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">TIM2, TIM5</text><text x="344" y="772" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">32</text><text x="404" y="772" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">4</text><text x="574" y="772" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">tempos longos, encoder</text><text x="44" y="796" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">gerais 16 bits</text><text x="194" y="796" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">TIM3, TIM4</text><text x="344" y="796" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">16</text><text x="404" y="796" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">4</text><text x="574" y="796" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">PWM, captura, encoder</text><text x="44" y="820" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">gerais menores</text><text x="194" y="820" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">TIM12–TIM17</text><text x="344" y="820" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">16</text><text x="404" y="820" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">1 ou 2</text><text x="574" y="820" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">PWM e captura simples</text><text x="44" y="844" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">básicos</text><text x="194" y="844" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">TIM6, TIM7</text><text x="344" y="844" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">16</text><text x="404" y="844" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">—</text><text x="574" y="844" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">base de tempo, disparo do DAC</text><text x="44" y="868" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">baixo consumo</text><text x="194" y="868" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">LPTIM1–LPTIM5</text><text x="344" y="868" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">16</text><text x="404" y="868" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">—</text><text x="574" y="868" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">contam no modo Stop</text><text x="44" y="892" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">alta resolução</text><text x="194" y="892" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">HRTIM</text><text x="344" y="892" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">16</text><text x="404" y="892" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">10 saídas</text><text x="574" y="892" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">conversores, 2,1 ns (veja HRTIM)</text>
<g transform="translate(24 922)"><rect width="952" height="64" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/><text x="18" y="27" font-size="14" font-weight="800" fill="#14532d" text-anchor="start">Na WeAct H743</text><text x="18" y="50" font-size="13" font-weight="400" fill="#1e293b" text-anchor="start">TIM2/TIM5 em PA0–PA3, livres (encoder em PA0/PA1). SysTick e os watchdogs também são contadores, com outro papel.</text></g>
</svg>
