<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 930" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">USB: conector, enumeração e velocidades</title>
  <desc id="d">Circuito do USB-C da WeAct H743 (D+ e D- em PA12/PA11, CC com 5,1 kOhm, VBUS pelo diodo B5819 e ponte SB6), as cinco etapas da enumeração, velocidades USB e classes de dispositivo.</desc>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
  <rect width="1000" height="930" fill="#ffffff"/>
<text x="24" y="34" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">1 · O CONECTOR USB-C DA WEACT H743 (ESQUEMA V1.2)</text>
<rect x="24" y="50" width="952" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="44" y="90" width="130" height="200" rx="8" fill="#64748b"/><text x="109.0" y="178.0" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">USB-C</text><text x="109.0" y="198.0" font-size="11" font-weight="400" fill="#f1f5f9" text-anchor="middle">conector</text><text x="109.0" y="214.0" font-size="11" font-weight="400" fill="#f1f5f9" text-anchor="middle">da placa</text>
<rect x="760" y="140" width="196" height="150" rx="8" fill="#0f3b2e"/><text x="858.0" y="195.0" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">H743</text><text x="858.0" y="215.0" font-size="11" font-weight="400" fill="#bbf7d0" text-anchor="middle">OTG_FS (OTG-HS2)</text><text x="858.0" y="231.0" font-size="11" font-weight="400" fill="#bbf7d0" text-anchor="middle">PHY full-speed interna</text><text x="858.0" y="247.0" font-size="11" font-weight="400" fill="#bbf7d0" text-anchor="middle">clock de 48 MHz</text>
<path d="M174 176 H758" fill="none" stroke="#1d4ed8" stroke-width="3" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="466" y="168" font-size="12.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">D+ → PA12 (OTG_FS_DP)</text><path d="M174 208 H758" fill="none" stroke="#7c3aed" stroke-width="3" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="466" y="200" font-size="12.5" font-weight="800" fill="#7c3aed" text-anchor="middle">D− → PA11 (OTG_FS_DM)</text><text x="466" y="228" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">par diferencial: o sinal é a diferença entre as duas linhas, 90 Ω</text><path d="M174 104 H300" stroke="#b91c1c" stroke-width="3"/><text x="186" y="126" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="start">VBUS 5 V do cabo</text><path d="M300 94 L320 104 L300 114 Z" fill="#b91c1c"/><path d="M320 92 V116" stroke="#b91c1c" stroke-width="3"/><text x="310" y="88" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="middle">B5819</text><path d="M320 104 H560" stroke="#b91c1c" stroke-width="3"/><rect x="560" y="76" width="176" height="56" rx="8" fill="#b91c1c"/><text x="648.0" y="100.0" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">rede 5V</text><text x="648.0" y="120.0" font-size="11" font-weight="400" fill="#fee2e2" text-anchor="middle">→ regulador 3V3</text>
<path d="M282 104 V62 H350 V104" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4"/><text x="360" y="60" font-size="11" font-weight="700" fill="#b45309" text-anchor="start">SB6: ponte de solda que contorna o diodo (modo host)</text><path d="M174 262 H280" stroke="#334155" stroke-width="2.5"/><path d="M174 282 H280" stroke="#334155" stroke-width="2.5"/><text x="186" y="256" font-size="11" font-weight="800" fill="#334155" text-anchor="start">CC1</text><text x="186" y="300" font-size="11" font-weight="800" fill="#334155" text-anchor="start">CC2</text><rect x="280" y="256" width="44" height="12" rx="2" fill="#fff" stroke="#334155" stroke-width="2"/><path d="M324 262 H350" stroke="#334155" stroke-width="2.5"/><rect x="280" y="276" width="44" height="12" rx="2" fill="#fff" stroke="#334155" stroke-width="2"/><path d="M324 282 H350" stroke="#334155" stroke-width="2.5"/><path d="M350 256 V300 M342 300 H358 M345 305 H355" stroke="#334155" stroke-width="2.5"/><text x="372" y="268" font-size="11.5" font-weight="700" fill="#334155" text-anchor="start">5,1 kΩ para GND em cada CC: &quot;sou dispositivo, me dê 5 V&quot;.</text><text x="372" y="286" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Sem esses resistores, carregadores USB-C não ligam o VBUS.</text><text x="500" y="352" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">O ESD (MKESD0402) protege D+ e D−. A placa não tem PHY ULPI, então fica em full-speed (12 Mbit/s).</text><text x="24" y="394" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">2 · O QUE ACONTECE QUANDO VOCÊ PLUGA (ENUMERAÇÃO)</text>
<rect x="34" y="412" width="178" height="108" rx="9" fill="#dbeafe" stroke="#93c5fd"/><circle cx="58" cy="438" r="14" fill="#1d4ed8"/><text x="58" y="443" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="80" y="443" font-size="14" font-weight="800" fill="#1d4ed8" text-anchor="start">conecta</text><text x="48" y="470" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start">o dispositivo liga o</text><text x="48" y="486" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start">pull-up de D+: &quot;sou</text><text x="48" y="502" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start">full-speed&quot;</text><path d="M214 466 H224" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ar)"/><rect x="224" y="412" width="178" height="108" rx="9" fill="#dbeafe" stroke="#93c5fd"/><circle cx="248" cy="438" r="14" fill="#1d4ed8"/><text x="248" y="443" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="270" y="443" font-size="14" font-weight="800" fill="#1d4ed8" text-anchor="start">reset</text><text x="238" y="470" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start">o host zera o barramento</text><path d="M404 466 H414" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ar)"/><rect x="414" y="412" width="178" height="108" rx="9" fill="#dbeafe" stroke="#93c5fd"/><circle cx="438" cy="438" r="14" fill="#1d4ed8"/><text x="438" y="443" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="460" y="443" font-size="14" font-weight="800" fill="#1d4ed8" text-anchor="start">descritores</text><text x="428" y="470" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start">o host pede VID, PID,</text><text x="428" y="486" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start">classe, endpoints</text><path d="M594 466 H604" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ar)"/><rect x="604" y="412" width="178" height="108" rx="9" fill="#dbeafe" stroke="#93c5fd"/><circle cx="628" cy="438" r="14" fill="#1d4ed8"/><text x="628" y="443" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="650" y="443" font-size="14" font-weight="800" fill="#1d4ed8" text-anchor="start">endereço</text><text x="618" y="470" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start">o host dá um número de 1</text><text x="618" y="486" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start">a 127</text><path d="M784 466 H794" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ar)"/><rect x="794" y="412" width="178" height="108" rx="9" fill="#dbeafe" stroke="#93c5fd"/><circle cx="818" cy="438" r="14" fill="#1d4ed8"/><text x="818" y="443" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">5</text><text x="840" y="443" font-size="14" font-weight="800" fill="#1d4ed8" text-anchor="start">driver</text><text x="808" y="470" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start">o sistema carrega o</text><text x="808" y="486" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start">driver da classe</text><text x="500" y="544" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">O host manda em tudo: o dispositivo só fala quando é consultado (a cada 1 ms em full-speed).</text><text x="24" y="586" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">3 · VELOCIDADES E CLASSES</text>
<rect x="24" y="602" width="466" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="44" y="630" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">Velocidade</text><text x="164" y="630" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">Taxa</text><text x="274" y="630" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">No H743</text><text x="44" y="654" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">Low-speed</text><text x="164" y="654" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">1,5 Mbit/s</text><text x="274" y="654" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">como host (teclado, mouse)</text><text x="44" y="678" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">Full-speed</text><text x="164" y="678" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">12 Mbit/s</text><text x="274" y="678" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">OTG_FS e OTG_HS (PHY interna)</text><text x="44" y="702" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">High-speed</text><text x="164" y="702" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">480 Mbit/s</text><text x="274" y="702" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">só OTG_HS + PHY ULPI externa</text>
<text x="44" y="722" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="start">Clock obrigatório de 48 MHz: PLL a partir do cristal</text><text x="44" y="740" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="start">de 25 MHz, ou HSI48 ajustado pelo CRS (sem cristal).</text><text x="44" y="768" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">USB 2.0 · 9 endpoints · FIFO de 4 KiB · host, device e OTG</text><rect x="510" y="602" width="466" height="190" rx="10" fill="#fffbeb" stroke="#f1d58a"/>
<text x="530" y="630" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">Classe</text><text x="630" y="630" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">Aparece como</text><text x="810" y="630" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">Uso</text><text x="530" y="654" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">CDC</text><text x="630" y="654" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">porta serial</text><text x="810" y="654" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">console, dados</text><text x="530" y="678" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">HID</text><text x="630" y="678" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">teclado, mouse, joystick</text><text x="810" y="678" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">sem driver</text><text x="530" y="702" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">MSC</text><text x="630" y="702" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">pendrive</text><text x="810" y="702" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">microSD pelo USB</text><text x="530" y="726" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">DFU</text><text x="630" y="726" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">dispositivo de gravação</text><text x="810" y="726" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">bootloader</text><text x="530" y="750" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">Audio · UVC</text><text x="630" y="750" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">som · webcam</text><text x="810" y="750" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">streaming</text>
<g transform="translate(24 808)"><rect width="952" height="104" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/><text x="18" y="27" font-size="14" font-weight="800" fill="#14532d" text-anchor="start">Na WeAct H743</text><text x="18" y="50" font-size="13" font-weight="400" fill="#1e293b" text-anchor="start">USB-C no OTG_FS (PA11/PA12). Segurando B0 ao ligar, o bootloader da ST aparece como DFU e aceita gravação sem ST-Link.</text><text x="18" y="70" font-size="13" font-weight="400" fill="#1e293b" text-anchor="start">Um segundo USB full-speed pode sair do OTG_HS nos headers: PB14 (D−) e PB15 (D+), usando a PHY interna.</text><text x="18" y="90" font-size="13" font-weight="400" fill="#1e293b" text-anchor="start">Modo host (pendrive, teclado): feche SB6 para mandar 5 V ao VBUS e respeite a corrente da fonte.</text></g>
</svg>
