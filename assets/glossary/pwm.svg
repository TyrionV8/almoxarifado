<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 980" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">PWM: contador, duty, frequência e tempo morto</title>
  <desc id="d">Geração de PWM por contador e comparação com duty de 25 e 75 por cento, fórmulas de frequência e duty, tabela de frequência por resolução com timer de 240 MHz, recomendações por aplicação e saídas complementares com tempo morto nos pinos PE9/PE8 da WeAct H743.</desc>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
  <rect width="1000" height="980" fill="#ffffff"/>
<text x="24" y="34" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">1 · COMO O TIMER GERA O PWM: CONTADOR × VALOR DE COMPARAÇÃO</text>
<rect x="24" y="50" width="952" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="44" y="86" font-size="12.5" font-weight="800" fill="#1e293b" text-anchor="start">CNT</text><text x="44" y="208" font-size="11" font-weight="400" fill="#475569" text-anchor="start">0</text><path d="M110 200 L310 80 V200 L510 80 V200 L710 80 V200 L910 80 V200" fill="none" stroke="#0f172a" stroke-width="2.2"/><path d="M110 80 H910" stroke="#94a3b8" stroke-dasharray="4 4"/><text x="904" y="74" font-size="11" font-weight="700" fill="#475569" text-anchor="end">ARR (período)</text><path d="M110 170.0 H510" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 3"/><text x="116" y="164.0" font-size="11" font-weight="800" fill="#1d4ed8" text-anchor="start">CCR = 25 %</text><path d="M510 110.0 H910" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 3"/><text x="516" y="104.0" font-size="11" font-weight="800" fill="#7c3aed" text-anchor="start">CCR = 75 %</text><path d="M110 250 H110 V250 H160.0 V290 H310 H310 V250 H360.0 V290 H510 H510 V250 H660.0 V290 H710 H710 V250 H860.0 V290 H910 V250" fill="none" stroke="#16a34a" stroke-width="2.6"/><text x="44" y="276" font-size="12.5" font-weight="800" fill="#16a34a" text-anchor="start">saída</text><text x="310" y="314" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">duty 25 %: fica em 1 enquanto CNT &lt; CCR</text><text x="710" y="314" font-size="11.5" font-weight="700" fill="#7c3aed" text-anchor="middle">duty 75 %: mesmo período, pulso maior</text><rect x="44" y="328" width="912" height="40" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="64" y="354" font-size="13" font-weight="800" fill="#1e293b" text-anchor="start">f_PWM = f_timer ÷ ((PSC + 1) × (ARR + 1))     ·     duty = CCR ÷ (ARR + 1)     ·     média na carga ≈ duty × tensão</text><text x="24" y="422" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">2 · FREQUÊNCIA × RESOLUÇÃO (TIMER A 240 MHz)</text>
<rect x="24" y="438" width="466" height="210" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="44" y="466" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">PWM</text><text x="174" y="466" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">PSC</text><text x="234" y="466" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">ARR</text><text x="324" y="466" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">passos de duty</text><text x="44" y="490" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">50 Hz (servo)</text><text x="174" y="490" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">239</text><text x="234" y="490" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">19 999</text><text x="324" y="490" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">20 000 · 1 µs cada</text><text x="44" y="514" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">1 kHz</text><text x="174" y="514" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">3</text><text x="234" y="514" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">59 999</text><text x="324" y="514" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">60 000 (≈ 16 bits)</text><text x="44" y="538" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">20 kHz (motor)</text><text x="174" y="538" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">0</text><text x="234" y="538" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">11 999</text><text x="324" y="538" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">12 000 (≈ 13,6 bits)</text><text x="44" y="562" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">100 kHz</text><text x="174" y="562" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">0</text><text x="234" y="562" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">2399</text><text x="324" y="562" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">2400 (≈ 11,2 bits)</text><text x="44" y="586" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">1 MHz</text><text x="174" y="586" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">0</text><text x="234" y="586" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">239</text><text x="324" y="586" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">240 (≈ 8 bits)</text>
<text x="44" y="628" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="start">Quanto maior a frequência, menos degraus de duty.</text><rect x="510" y="438" width="466" height="210" rx="10" fill="#fffbeb" stroke="#f1d58a"/>
<text x="530" y="466" font-size="12.5" font-weight="800" fill="#1e293b" text-anchor="start">Escolhendo a frequência</text><text x="530" y="494" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">• LED: &gt; 1 kHz para não piscar em câmeras e movimento</text><text x="530" y="518" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">• motor DC: 16–25 kHz, acima do audível</text><text x="530" y="542" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">• servo: 50 Hz, pulso de 1 a 2 ms (CCR 1000–2000 acima)</text><text x="530" y="566" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">• fonte chaveada: 100 kHz ou mais; resolução fina → HRTIM</text><text x="530" y="590" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">• PWM como DAC: alta frequência + filtro RC</text><text x="24" y="690" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">3 · SAÍDAS COMPLEMENTARES E TEMPO MORTO (TIM1 / TIM8)</text>
<rect x="24" y="706" width="952" height="170" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="44" y="752" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="start">CH1 · PE9</text><text x="44" y="812" font-size="12" font-weight="800" fill="#7c3aed" text-anchor="start">CH1N · PE8</text><path d="M160 766 H242 V736 H360.0 V766 H522 V736 H640.0 V766 H682.0" fill="none" stroke="#1d4ed8" stroke-width="2.4"/><path d="M160 796 H220 V826 H382.0 V796 H500 V826 H662.0 V796 H682.0" fill="none" stroke="#7c3aed" stroke-width="2.4"/><rect x="220" y="728" width="22" height="106" fill="#fee2e2" opacity=".8"/><rect x="360.0" y="728" width="22" height="106" fill="#fee2e2" opacity=".8"/><rect x="500" y="728" width="22" height="106" fill="#fee2e2" opacity=".8"/><rect x="640.0" y="728" width="22" height="106" fill="#fee2e2" opacity=".8"/><text x="371.0" y="850" font-size="10.5" font-weight="800" fill="#b91c1c" text-anchor="middle">tempo morto: os dois desligados</text><text x="740" y="740" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start">Em meia ponte, CH1 aciona</text><text x="740" y="756" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start">o MOSFET de cima e CH1N</text><text x="740" y="772" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start">o de baixo. O tempo morto</text><text x="740" y="788" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start">evita que os dois conduzam</text><text x="740" y="804" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="start">juntos (curto na fonte).</text><text x="740" y="830" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Entrada BKIN desliga tudo</text><text x="740" y="846" font-size="11" font-weight="400" fill="#475569" text-anchor="start">numa falha, por hardware.</text><g transform="translate(24 892)"><rect width="952" height="84" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/><text x="18" y="27" font-size="14" font-weight="800" fill="#14532d" text-anchor="start">Na WeAct H743</text><text x="18" y="50" font-size="13" font-weight="400" fill="#1e293b" text-anchor="start">TIM2_CH1–CH4 em PA0–PA3, livres (32 bits). TIM1_CH1/CH1N em PE9/PE8 para meia ponte. A luz de fundo do display (PE10) é TIM1_CH2N:</text><text x="18" y="70" font-size="13" font-weight="400" fill="#1e293b" text-anchor="start">o brilho do LCD se ajusta por PWM. O pino só fornece poucos mA: carga de potência sempre por transistor, MOSFET ou driver.</text></g>
</svg>
