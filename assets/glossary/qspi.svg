<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">QSPI: ligação e leitura em quatro linhas</title>
  <desc id="d">Comparação entre SPI (um bit por clock) e QSPI (quatro bits por clock), pinos da Flash QSPI da WeAct H743 e diagrama de tempo de uma leitura Fast Read Quad I/O (EBh).</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
  </defs>
  <rect width="1000" height="800" fill="#ffffff"/>

  <!-- 1. Comparação de ligação -->
  <text x="24" y="34" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">1 · LIGAÇÃO</text>

  <g transform="translate(24 50)">
    <rect width="462" height="236" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="16" y="28" font-size="17" font-weight="800" fill="#1e293b">SPI comum · 1 bit por clock</text>
    <rect x="16" y="46" width="120" height="170" rx="8" fill="#0f3b2e"/>
    <text x="76" y="126" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">MCU</text>
    <text x="76" y="146" font-size="11" fill="#bbf7d0" text-anchor="middle">controlador</text>
    <rect x="326" y="46" width="120" height="170" rx="8" fill="#334155"/>
    <text x="386" y="126" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">Flash</text>
    <text x="386" y="146" font-size="11" fill="#cbd5e1" text-anchor="middle">periférico</text>
    <g font-size="13" font-weight="700" fill="#334155">
      <line x1="136" y1="72" x2="324" y2="72" stroke="#334155" stroke-width="2.5" marker-end="url(#ar)"/><text x="231" y="66" text-anchor="middle">CS (seleção)</text>
      <line x1="136" y1="112" x2="324" y2="112" stroke="#334155" stroke-width="2.5" marker-end="url(#ar)"/><text x="231" y="106" text-anchor="middle">SCK (clock)</text>
      <line x1="136" y1="152" x2="324" y2="152" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ar)"/><text x="231" y="146" text-anchor="middle" fill="#1d4ed8">MOSI · só ida</text>
      <line x1="136" y1="192" x2="324" y2="192" stroke="#7c3aed" stroke-width="2.5" marker-start="url(#ar)"/><text x="231" y="186" text-anchor="middle" fill="#7c3aed">MISO · só volta</text>
    </g>
  </g>

  <g transform="translate(514 50)">
    <rect width="462" height="236" rx="10" fill="#fffbeb" stroke="#f1d58a"/>
    <text x="16" y="28" font-size="17" font-weight="800" fill="#1e293b">QSPI · 4 bits por clock</text>
    <rect x="16" y="46" width="120" height="170" rx="8" fill="#0f3b2e"/>
    <text x="76" y="118" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">H743</text>
    <text x="76" y="138" font-size="11" fill="#bbf7d0" text-anchor="middle">QUADSPI</text>
    <text x="76" y="154" font-size="11" fill="#bbf7d0" text-anchor="middle">banco 1</text>
    <rect x="326" y="46" width="120" height="170" rx="8" fill="#334155"/>
    <text x="386" y="118" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">PY25Q64HA</text>
    <text x="386" y="138" font-size="11" fill="#cbd5e1" text-anchor="middle">8 MB · no verso</text>
    <g font-size="12" font-weight="700" fill="#334155">
      <line x1="136" y1="64" x2="324" y2="64" stroke="#334155" stroke-width="2.5" marker-end="url(#ar)"/><text x="231" y="59" text-anchor="middle">NCS · PB6</text>
      <line x1="136" y1="94" x2="324" y2="94" stroke="#334155" stroke-width="2.5" marker-end="url(#ar)"/><text x="231" y="89" text-anchor="middle">CLK · PB2</text>
      <g stroke="#b45309" stroke-width="3">
        <line x1="138" y1="124" x2="322" y2="124" marker-start="url(#ag)" marker-end="url(#ag)"/>
        <line x1="138" y1="150" x2="322" y2="150" marker-start="url(#ag)" marker-end="url(#ag)"/>
        <line x1="138" y1="176" x2="322" y2="176" marker-start="url(#ag)" marker-end="url(#ag)"/>
        <line x1="138" y1="202" x2="322" y2="202" marker-start="url(#ag)" marker-end="url(#ag)"/>
      </g>
      <g fill="#92400e" font-size="11.5">
        <text x="231" y="117" text-anchor="middle">IO0 · PD11 (era MOSI)</text>
        <text x="231" y="143" text-anchor="middle">IO1 · PD12 (era MISO)</text>
        <text x="231" y="169" text-anchor="middle">IO2 · PE2 (era /WP)</text>
        <text x="231" y="195" text-anchor="middle">IO3 · PD13 (era /HOLD)</text>
      </g>
    </g>
  </g>
  <text x="500" y="312" font-size="13.5" fill="#475569" text-anchor="middle">As quatro linhas IO são bidirecionais: o controlador inverte o sentido entre enviar o comando e receber os dados.</text>

  <!-- 2. Diagrama de tempo -->
  <text x="24" y="356" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">2 · UMA LEITURA "FAST READ QUAD I/O" (EBh), CLOCK A CLOCK</text>
  <g transform="translate(24 372)" font-size="12.5">
    <!-- fases -->
    <g font-weight="800" font-size="12">
      <rect x="92" y="0" width="256" height="26" rx="4" fill="#e2e8f0"/><text x="220" y="18" text-anchor="middle" fill="#334155">instrução EBh · 8 clocks só em IO0</text>
      <rect x="350" y="0" width="192" height="26" rx="4" fill="#dbeafe"/><text x="446" y="18" text-anchor="middle" fill="#1d4ed8">endereço 24 bits · 6 clocks</text>
      <rect x="544" y="0" width="64" height="26" rx="4" fill="#ede9fe"/><text x="576" y="18" text-anchor="middle" fill="#6d28d9">modo</text>
      <rect x="610" y="0" width="128" height="26" rx="4" fill="#f1f5f9"/><text x="674" y="18" text-anchor="middle" fill="#64748b">dummy · 4</text>
      <rect x="740" y="0" width="212" height="26" rx="4" fill="#fef3c7"/><text x="846" y="18" text-anchor="middle" fill="#92400e">dados · 2 clocks por byte</text>
    </g>
    <g font-weight="700" fill="#334155">
      <text x="0" y="60">NCS</text><text x="0" y="100">CLK</text>
      <text x="0" y="140">IO0</text><text x="0" y="180">IO1</text><text x="0" y="220">IO2</text><text x="0" y="260">IO3</text>
    </g>
    <path d="M60 44 H80 V64 H952" fill="none" stroke="#0f172a" stroke-width="2"/>
    <path d="M60 104 H92" fill="none" stroke="#0f172a" stroke-width="2"/>
    <path d="M92 104 v-20 h16 v20 h16 v-20 h16 v20 h16 v-20 h16 v20 h16 v-20 h16 v20 h16 v-20 h16 v20 h16 v-20 h16 v20 h16 v-20 h16 v20 h16 v-20 h16 v20 h16 v-20 h16 v20 h16 v-20 h16 v20 h16 v-20 h16 v20 h16 v-20 h16 v20 h16 v-20 h16 v20 h16 v-20 h16 v20 h16 v-20 h16 v20 h16 v-20 h16 v20 h16 v-20 h16 v20 h16 v-20 h16 v20 h16 v-20 h16 v20 h16 v-20 h16 v20 h16 v-20 h16 v20 h16 v-20 h16 v20 h16 v-20 h16 v20 h16 v-20 h16 v20 h16 v-20 h16 v20 h16 v-20 h16 v20 h16" fill="none" stroke="#0f172a" stroke-width="1.6"/>
    <!-- IO0: instrução 8 bits, depois nibbles -->
    <g stroke="#475569" stroke-width="1.6" fill="#f8fafc">
      <path d="M92 136 l4 -10 h24 l4 10 l-4 10 h-24z"/><path d="M124 136 l4 -10 h24 l4 10 l-4 10 h-24z"/><path d="M156 136 l4 -10 h24 l4 10 l-4 10 h-24z"/><path d="M188 136 l4 -10 h24 l4 10 l-4 10 h-24z"/>
      <path d="M220 136 l4 -10 h24 l4 10 l-4 10 h-24z"/><path d="M252 136 l4 -10 h24 l4 10 l-4 10 h-24z"/><path d="M284 136 l4 -10 h24 l4 10 l-4 10 h-24z"/><path d="M316 136 l4 -10 h24 l4 10 l-4 10 h-24z"/>
    </g>
    <g font-size="11" font-weight="700" fill="#334155" text-anchor="middle">
      <text x="108" y="140">1</text><text x="140" y="140">1</text><text x="172" y="140">1</text><text x="204" y="140">0</text><text x="236" y="140">1</text><text x="268" y="140">0</text><text x="300" y="140">1</text><text x="332" y="140">1</text>
    </g>
    <!-- IO1..IO3 parados durante a instrução -->
    <g stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"><path d="M92 176 H348"/><path d="M92 216 H348"/><path d="M92 256 H348"/></g>
    <g font-size="10.5" fill="#94a3b8"><text x="96" y="171">parado</text><text x="96" y="211">parado (/WP)</text><text x="96" y="251">parado (/HOLD)</text></g>
    <!-- endereço, modo, dummy, dados nas 4 linhas -->
    <g stroke-width="1.6">
      <g id="lane" transform="translate(0 0)">
        <g stroke="#1d4ed8" fill="#dbeafe"><path d="M350 136 l4 -10 h24 l4 10 l-4 10 h-24z"/><path d="M382 136 l4 -10 h24 l4 10 l-4 10 h-24z"/><path d="M414 136 l4 -10 h24 l4 10 l-4 10 h-24z"/><path d="M446 136 l4 -10 h24 l4 10 l-4 10 h-24z"/><path d="M478 136 l4 -10 h24 l4 10 l-4 10 h-24z"/><path d="M510 136 l4 -10 h24 l4 10 l-4 10 h-24z"/></g>
        <g stroke="#6d28d9" fill="#ede9fe"><path d="M544 136 l4 -10 h24 l4 10 l-4 10 h-24z"/><path d="M576 136 l4 -10 h24 l4 10 l-4 10 h-24z"/></g>
        <path d="M610 136 H738" stroke="#94a3b8" stroke-dasharray="3 4" fill="none"/>
        <g stroke="#b45309" fill="#fef3c7"><path d="M740 136 l4 -10 h24 l4 10 l-4 10 h-24z"/><path d="M772 136 l4 -10 h24 l4 10 l-4 10 h-24z"/><path d="M804 136 l4 -10 h24 l4 10 l-4 10 h-24z"/><path d="M836 136 l4 -10 h24 l4 10 l-4 10 h-24z"/><path d="M868 136 l4 -10 h24 l4 10 l-4 10 h-24z"/><path d="M900 136 l4 -10 h24 l4 10 l-4 10 h-24z"/></g>
      </g>
      <use href="#lane" y="40"/><use href="#lane" y="80"/><use href="#lane" y="120"/>
    </g>
    <g font-size="10.5" font-weight="700" text-anchor="middle" fill="#92400e">
      <text x="788" y="292">byte 0</text><text x="852" y="292">byte 1</text><text x="916" y="292">byte 2 …</text>
    </g>
    <path d="M740 276 v6 h62 v-6 M804 276 v6 h62 v-6 M868 276 v6 h62 v-6" fill="none" stroke="#b45309" stroke-width="1.5"/>
    <text x="446" y="292" font-size="10.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">A23…A0: 4 bits por clock</text>
    <text x="674" y="292" font-size="10.5" font-weight="700" fill="#64748b" text-anchor="middle">tempo p/ a Flash buscar</text>
  </g>

  <!-- 3. Resumo -->
  <g transform="translate(24 690)">
    <rect width="952" height="92" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="18" y="27" font-size="14" font-weight="800" fill="#14532d">Por que é mais rápido</text>
    <text x="18" y="50" font-size="13" fill="#1e293b">Cada byte de dados leva 2 clocks em QSPI contra 8 em SPI comum. O custo fixo (instrução, endereço, modo e dummy)</text>
    <text x="18" y="70" font-size="13" fill="#1e293b">é pago uma vez por leitura: em leituras longas e no modo mapeado em memória, a vazão chega perto de 4× a do SPI no mesmo clock.</text>
  </g>
</svg>
