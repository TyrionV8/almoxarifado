<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">UART: ligação e quadro de um byte</title>
  <desc id="d">Ligação cruzada entre CH343P e o USART1 da WeAct H743, nível lógico de 3,3 V × RS-232, forma de onda do byte 0x41 em 8N1 a 115200 bit/s e tabela de erros comuns.</desc>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
  <rect width="1000" height="900" fill="#ffffff"/>
<text x="24" y="34" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">1 · LIGAÇÃO: TX DE UM NO RX DO OUTRO, E GND COMUM</text>
<rect x="24" y="50" width="952" height="210" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="44" y="78" width="130" height="150" rx="8" fill="#1f2937"/><text x="109.0" y="141.0" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">Computador</text><text x="109.0" y="161.0" font-size="11" font-weight="400" fill="#cbd5e1" text-anchor="middle">terminal serial</text><text x="109.0" y="177.0" font-size="11" font-weight="400" fill="#cbd5e1" text-anchor="middle">115200 8N1</text>
<path d="M174 153 H262" fill="none" stroke="#334155" stroke-width="4" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="218" y="144" font-size="12" font-weight="800" fill="#334155" text-anchor="middle">USB</text><rect x="264" y="78" width="150" height="150" rx="8" fill="#334155"/><text x="339.0" y="149.0" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">CH343P</text><text x="339.0" y="169.0" font-size="11" font-weight="400" fill="#cbd5e1" text-anchor="middle">ponte USB–UART</text>
<rect x="716" y="78" width="150" height="150" rx="8" fill="#0f3b2e"/><text x="791.0" y="141.0" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">H743</text><text x="791.0" y="161.0" font-size="11" font-weight="400" fill="#bbf7d0" text-anchor="middle">USART1</text><text x="791.0" y="177.0" font-size="11" font-weight="400" fill="#bbf7d0" text-anchor="middle">PA9 / PA10</text>
<path d="M414 112 H714" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ar)"/><text x="564" y="104" font-size="12.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">TX do CH343P → RX do H743 (PA10)</text><path d="M714 156 H416" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#ar)"/><text x="564" y="148" font-size="12.5" font-weight="700" fill="#7c3aed" text-anchor="middle">RX do CH343P ← TX do H743 (PA9)</text><path d="M414 200 H714" fill="none" stroke="#334155" stroke-width="2.5"/><text x="564" y="192" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">GND ↔ GND (referência obrigatória)</text><text x="890" y="110" font-size="13" font-weight="800" fill="#16a34a" text-anchor="start">✓ 3,3 V</text><text x="890" y="130" font-size="12" font-weight="400" fill="#16a34a" text-anchor="start">lógico</text><text x="890" y="170" font-size="13" font-weight="800" fill="#b91c1c" text-anchor="start">✗ RS-232</text><text x="890" y="190" font-size="12" font-weight="400" fill="#b91c1c" text-anchor="start">±12 V</text><text x="890" y="206" font-size="12" font-weight="400" fill="#b91c1c" text-anchor="start">queima</text><text x="500" y="284" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">Não há clock no fio: cada lado mede o tempo com o próprio oscilador, por isso a velocidade (baud rate) precisa ser combinada.</text><text x="24" y="328" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">2 · UM BYTE NO FIO: &quot;A&quot; = 0x41, FORMATO 8N1 A 115 200 BIT/S</text>
<path d="M50 380 H110 V430 H182 V380 H254 V430 H326 V430 H398 V430 H470 V430 H542 V430 H614 V380 H686 V430 H758 V380 H830 V380 H890" fill="none" stroke="#0f172a" stroke-width="2.5"/><text x="40" y="385" font-size="13" font-weight="700" fill="#475569" text-anchor="start">1</text><text x="40" y="435" font-size="13" font-weight="700" fill="#475569" text-anchor="start">0</text><text x="24" y="360" font-size="13" font-weight="800" fill="#1e293b" text-anchor="start">TX</text><rect x="112" y="448" width="68" height="26" rx="4" fill="#dcfce7"/><text x="146.0" y="466" font-size="12" font-weight="800" fill="#16a34a" text-anchor="middle">start</text><text x="146.0" y="494" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">0</text><line x1="110" y1="364" x2="110" y2="440" stroke="#cbd5e1" stroke-dasharray="3 3"/><circle cx="146.0" cy="430" r="4" fill="#b45309"/><rect x="184" y="448" width="68" height="26" rx="4" fill="#dbeafe"/><text x="218.0" y="466" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">D0</text><text x="218.0" y="494" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">1</text><line x1="182" y1="364" x2="182" y2="440" stroke="#cbd5e1" stroke-dasharray="3 3"/><circle cx="218.0" cy="380" r="4" fill="#b45309"/><rect x="256" y="448" width="68" height="26" rx="4" fill="#dbeafe"/><text x="290.0" y="466" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">D1</text><text x="290.0" y="494" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">0</text><line x1="254" y1="364" x2="254" y2="440" stroke="#cbd5e1" stroke-dasharray="3 3"/><circle cx="290.0" cy="430" r="4" fill="#b45309"/><rect x="328" y="448" width="68" height="26" rx="4" fill="#dbeafe"/><text x="362.0" y="466" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">D2</text><text x="362.0" y="494" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">0</text><line x1="326" y1="364" x2="326" y2="440" stroke="#cbd5e1" stroke-dasharray="3 3"/><circle cx="362.0" cy="430" r="4" fill="#b45309"/><rect x="400" y="448" width="68" height="26" rx="4" fill="#dbeafe"/><text x="434.0" y="466" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">D3</text><text x="434.0" y="494" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">0</text><line x1="398" y1="364" x2="398" y2="440" stroke="#cbd5e1" stroke-dasharray="3 3"/><circle cx="434.0" cy="430" r="4" fill="#b45309"/><rect x="472" y="448" width="68" height="26" rx="4" fill="#dbeafe"/><text x="506.0" y="466" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">D4</text><text x="506.0" y="494" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">0</text><line x1="470" y1="364" x2="470" y2="440" stroke="#cbd5e1" stroke-dasharray="3 3"/><circle cx="506.0" cy="430" r="4" fill="#b45309"/><rect x="544" y="448" width="68" height="26" rx="4" fill="#dbeafe"/><text x="578.0" y="466" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">D5</text><text x="578.0" y="494" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">0</text><line x1="542" y1="364" x2="542" y2="440" stroke="#cbd5e1" stroke-dasharray="3 3"/><circle cx="578.0" cy="430" r="4" fill="#b45309"/><rect x="616" y="448" width="68" height="26" rx="4" fill="#dbeafe"/><text x="650.0" y="466" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">D6</text><text x="650.0" y="494" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">1</text><line x1="614" y1="364" x2="614" y2="440" stroke="#cbd5e1" stroke-dasharray="3 3"/><circle cx="650.0" cy="380" r="4" fill="#b45309"/><rect x="688" y="448" width="68" height="26" rx="4" fill="#dbeafe"/><text x="722.0" y="466" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">D7</text><text x="722.0" y="494" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">0</text><line x1="686" y1="364" x2="686" y2="440" stroke="#cbd5e1" stroke-dasharray="3 3"/><circle cx="722.0" cy="430" r="4" fill="#b45309"/><rect x="760" y="448" width="68" height="26" rx="4" fill="#fee2e2"/><text x="794.0" y="466" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">stop</text><text x="794.0" y="494" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">1</text><line x1="758" y1="364" x2="758" y2="440" stroke="#cbd5e1" stroke-dasharray="3 3"/><circle cx="794.0" cy="380" r="4" fill="#b45309"/><line x1="830" y1="364" x2="830" y2="440" stroke="#cbd5e1" stroke-dasharray="3 3"/><text x="55" y="366" font-size="11" font-weight="400" fill="#475569" text-anchor="start">ocioso = 1</text><text x="836" y="366" font-size="11" font-weight="400" fill="#475569" text-anchor="start">ocioso</text><path d="M184 516 H756" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="470" y="532" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">bits de dados, do menos significativo (D0) para o mais significativo (D7): 0x41 = 0100 0001</text><path d="M110 552 H180" fill="none" stroke="#475569" stroke-width="1.4" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="190" y="556" font-size="12" font-weight="400" fill="#475569" text-anchor="start">1 bit = 1 / 115 200 s ≈ 8,68 µs · quadro de 10 bits ≈ 86,8 µs → até 11 520 bytes/s</text><circle cx="118" cy="580" r="4" fill="#b45309"/><text x="130" y="584" font-size="12" font-weight="700" fill="#b45309" text-anchor="start">o receptor detecta a descida do start e lê cada bit no meio (amostragem 16× ou 8×)</text><text x="24" y="628" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">3 · A NOTAÇÃO 8N1 E OS ERROS COMUNS</text>
<rect x="24" y="644" width="466" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="44" y="672" font-size="12.5" font-weight="800" fill="#1e293b" text-anchor="start">Parte</text><text x="134" y="672" font-size="12.5" font-weight="800" fill="#1e293b" text-anchor="start">Significado</text><text x="44" y="696" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">8</text><text x="134" y="696" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">bits de dados (7, 8 ou 9)</text><text x="44" y="720" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">N</text><text x="134" y="720" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">sem paridade (E = par, O = ímpar)</text><text x="44" y="744" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">1</text><text x="134" y="744" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">bits de parada (1 ou 2)</text><text x="44" y="768" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">115200</text><text x="134" y="768" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">bits por segundo, iguais nos dois lados</text>
<rect x="510" y="644" width="466" height="150" rx="10" fill="#fffbeb" stroke="#f1d58a"/>
<text x="530" y="672" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">Sintoma</text><text x="710" y="672" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">Causa provável</text><text x="530" y="696" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">nada chega</text><text x="710" y="696" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">TX ligado em TX; falta GND</text><text x="530" y="720" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">caracteres estranhos</text><text x="710" y="720" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">baud rate diferente</text><text x="530" y="744" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">erro de quadro</text><text x="710" y="744" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">formato diferente, clock impreciso</text><text x="530" y="768" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">bytes perdidos</text><text x="710" y="768" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">sem FIFO/DMA ou RTS/CTS</text>
<g transform="translate(24 810)"><rect width="952" height="70" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/><text x="18" y="27" font-size="14" font-weight="800" fill="#14532d" text-anchor="start">Tolerância</text><text x="18" y="50" font-size="13" font-weight="400" fill="#1e293b" text-anchor="start">A soma dos erros de clock dos dois lados deve ficar abaixo de cerca de 2 %; cristais atendem, osciladores RC internos podem não atender.</text></g>
</svg>
