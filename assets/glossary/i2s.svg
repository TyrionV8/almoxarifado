<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 920" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">I2S: ligação, quadro estéreo e clocks de áudio</title>
  <desc id="d">I2S2 da WeAct H743 ligado a um amplificador MAX98357A e a um microfone INMP441, quadro estéreo Philips de 16 bits por canal, contas de BCLK e MCK a 48 kHz e comparação I2S x SAI no H743.</desc>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
  <rect width="1000" height="920" fill="#ffffff"/>
<text x="24" y="34" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">1 · LIGAÇÃO: I2S2 DA H743 COM AMPLIFICADOR E MICROFONE DIGITAIS</text>
<rect x="24" y="50" width="952" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="44" y="80" width="150" height="190" rx="8" fill="#0f3b2e"/><text x="119.0" y="163.0" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">H743</text><text x="119.0" y="183.0" font-size="11" font-weight="400" fill="#bbf7d0" text-anchor="middle">I2S2 · mestre</text><text x="119.0" y="199.0" font-size="11" font-weight="400" fill="#bbf7d0" text-anchor="middle">gera CK e WS</text>
<rect x="760" y="70" width="196" height="96" rx="8" fill="#334155"/><text x="858.0" y="114.0" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">MAX98357A</text><text x="858.0" y="134.0" font-size="11" font-weight="400" fill="#cbd5e1" text-anchor="middle">amplificador I2S → alto-falante</text>
<rect x="760" y="186" width="196" height="96" rx="8" fill="#475569"/><text x="858.0" y="230.0" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">INMP441</text><text x="858.0" y="250.0" font-size="11" font-weight="400" fill="#e2e8f0" text-anchor="middle">microfone I2S</text>
<path d="M194 104 H600 V96 H758" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#ar)"/><path d="M600 104 V212 H758" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#ar)"/><text x="214" y="98" font-size="12" font-weight="700" fill="#b45309" text-anchor="start">CK · PB13 (BCLK, clock de bit)</text><path d="M194 144 H630 V116 H758" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#ar)"/><path d="M630 144 V232 H758" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#ar)"/><text x="214" y="138" font-size="12" font-weight="700" fill="#0f766e" text-anchor="start">WS · PB12 (LRCLK: esquerdo/direito)</text><path d="M194 184 H660 V136 H758" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ar)"/><text x="214" y="178" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="start">SDO · PB15 → DIN (áudio para tocar)</text><path d="M758 256 H196" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#ar)"/><text x="214" y="250" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="start">SDI · PB14 ← SD (áudio gravado)</text><text x="214" y="226" font-size="11" font-weight="400" fill="#475569" text-anchor="start">MCK (256 × Fs) é opcional: esses dois módulos não usam</text><text x="500" y="322" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">É um barramento só de áudio: o clock e o sinal de canal (WS) são compartilhados, e cada sentido tem sua linha de dados.</text><text x="24" y="364" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">2 · UM QUADRO ESTÉREO NO PADRÃO PHILIPS (16 BITS POR CANAL)</text>
<text x="24" y="404" font-size="13" font-weight="800" fill="#1e293b" text-anchor="start">WS</text><text x="24" y="444" font-size="13" font-weight="800" fill="#1e293b" text-anchor="start">CK</text><text x="24" y="486" font-size="13" font-weight="800" fill="#1e293b" text-anchor="start">SD</text><path d="M70 390 H86 V410 H470 V390 H854 V410 H902" fill="none" stroke="#0f172a" stroke-width="2"/><path d="M70 450 v-20 h12.0 v20 h12.0 v-20 h12.0 v20 h12.0 v-20 h12.0 v20 h12.0 v-20 h12.0 v20 h12.0 v-20 h12.0 v20 h12.0 v-20 h12.0 v20 h12.0 v-20 h12.0 v20 h12.0 v-20 h12.0 v20 h12.0 v-20 h12.0 v20 h12.0 v-20 h12.0 v20 h12.0 v-20 h12.0 v20 h12.0 v-20 h12.0 v20 h12.0 v-20 h12.0 v20 h12.0 v-20 h12.0 v20 h12.0 v-20 h12.0 v20 h12.0 v-20 h12.0 v20 h12.0 v-20 h12.0 v20 h12.0 v-20 h12.0 v20 h12.0 v-20 h12.0 v20 h12.0 v-20 h12.0 v20 h12.0 v-20 h12.0 v20 h12.0 v-20 h12.0 v20 h12.0 v-20 h12.0 v20 h12.0 v-20 h12.0 v20 h12.0 v-20 h12.0 v20 h12.0 v-20 h12.0 v20 h12.0 v-20 h12.0 v20 h12.0 v-20 h12.0 v20 h12.0 v-20 h12.0 v20 h12.0 v-20 h12.0 v20 h12.0 v-20 h12.0 v20 h12.0 v-20 h12.0 v20 h12.0 v-20 h12.0 v20 h12.0 v-20 h12.0 v20 h12.0 v-20 h12.0 v20 h12.0 v-20 h12.0 v20 h12.0" fill="none" stroke="#0f172a" stroke-width="1.6"/><path d="M110 482 l4 -10 h16 l4 10 l-4 10 h-16z" stroke="#1d4ed8" fill="#dbeafe" stroke-width="1.6"/><path d="M134 482 l4 -10 h16 l4 10 l-4 10 h-16z" stroke="#1d4ed8" fill="#dbeafe" stroke-width="1.6"/><path d="M158 482 l4 -10 h16 l4 10 l-4 10 h-16z" stroke="#1d4ed8" fill="#dbeafe" stroke-width="1.6"/><path d="M182 482 l4 -10 h16 l4 10 l-4 10 h-16z" stroke="#1d4ed8" fill="#dbeafe" stroke-width="1.6"/><path d="M206 482 l4 -10 h16 l4 10 l-4 10 h-16z" stroke="#1d4ed8" fill="#dbeafe" stroke-width="1.6"/><path d="M230 482 l4 -10 h16 l4 10 l-4 10 h-16z" stroke="#1d4ed8" fill="#dbeafe" stroke-width="1.6"/><path d="M254 482 l4 -10 h16 l4 10 l-4 10 h-16z" stroke="#1d4ed8" fill="#dbeafe" stroke-width="1.6"/><path d="M278 482 l4 -10 h16 l4 10 l-4 10 h-16z" stroke="#1d4ed8" fill="#dbeafe" stroke-width="1.6"/><path d="M302 482 l4 -10 h16 l4 10 l-4 10 h-16z" stroke="#1d4ed8" fill="#dbeafe" stroke-width="1.6"/><path d="M326 482 l4 -10 h16 l4 10 l-4 10 h-16z" stroke="#1d4ed8" fill="#dbeafe" stroke-width="1.6"/><path d="M350 482 l4 -10 h16 l4 10 l-4 10 h-16z" stroke="#1d4ed8" fill="#dbeafe" stroke-width="1.6"/><path d="M374 482 l4 -10 h16 l4 10 l-4 10 h-16z" stroke="#1d4ed8" fill="#dbeafe" stroke-width="1.6"/><path d="M398 482 l4 -10 h16 l4 10 l-4 10 h-16z" stroke="#1d4ed8" fill="#dbeafe" stroke-width="1.6"/><path d="M422 482 l4 -10 h16 l4 10 l-4 10 h-16z" stroke="#1d4ed8" fill="#dbeafe" stroke-width="1.6"/><path d="M446 482 l4 -10 h16 l4 10 l-4 10 h-16z" stroke="#1d4ed8" fill="#dbeafe" stroke-width="1.6"/><path d="M470 482 l4 -10 h16 l4 10 l-4 10 h-16z" stroke="#1d4ed8" fill="#dbeafe" stroke-width="1.6"/><text x="112" y="474" font-size="9.5" font-weight="700" fill="#1d4ed8" text-anchor="start">MSB</text><text x="472" y="474" font-size="9.5" font-weight="700" fill="#1d4ed8" text-anchor="start">LSB</text><path d="M494 482 l4 -10 h16 l4 10 l-4 10 h-16z" stroke="#7c3aed" fill="#ede9fe" stroke-width="1.6"/><path d="M518 482 l4 -10 h16 l4 10 l-4 10 h-16z" stroke="#7c3aed" fill="#ede9fe" stroke-width="1.6"/><path d="M542 482 l4 -10 h16 l4 10 l-4 10 h-16z" stroke="#7c3aed" fill="#ede9fe" stroke-width="1.6"/><path d="M566 482 l4 -10 h16 l4 10 l-4 10 h-16z" stroke="#7c3aed" fill="#ede9fe" stroke-width="1.6"/><path d="M590 482 l4 -10 h16 l4 10 l-4 10 h-16z" stroke="#7c3aed" fill="#ede9fe" stroke-width="1.6"/><path d="M614 482 l4 -10 h16 l4 10 l-4 10 h-16z" stroke="#7c3aed" fill="#ede9fe" stroke-width="1.6"/><path d="M638 482 l4 -10 h16 l4 10 l-4 10 h-16z" stroke="#7c3aed" fill="#ede9fe" stroke-width="1.6"/><path d="M662 482 l4 -10 h16 l4 10 l-4 10 h-16z" stroke="#7c3aed" fill="#ede9fe" stroke-width="1.6"/><path d="M686 482 l4 -10 h16 l4 10 l-4 10 h-16z" stroke="#7c3aed" fill="#ede9fe" stroke-width="1.6"/><path d="M710 482 l4 -10 h16 l4 10 l-4 10 h-16z" stroke="#7c3aed" fill="#ede9fe" stroke-width="1.6"/><path d="M734 482 l4 -10 h16 l4 10 l-4 10 h-16z" stroke="#7c3aed" fill="#ede9fe" stroke-width="1.6"/><path d="M758 482 l4 -10 h16 l4 10 l-4 10 h-16z" stroke="#7c3aed" fill="#ede9fe" stroke-width="1.6"/><path d="M782 482 l4 -10 h16 l4 10 l-4 10 h-16z" stroke="#7c3aed" fill="#ede9fe" stroke-width="1.6"/><path d="M806 482 l4 -10 h16 l4 10 l-4 10 h-16z" stroke="#7c3aed" fill="#ede9fe" stroke-width="1.6"/><path d="M830 482 l4 -10 h16 l4 10 l-4 10 h-16z" stroke="#7c3aed" fill="#ede9fe" stroke-width="1.6"/><path d="M854 482 l4 -10 h16 l4 10 l-4 10 h-16z" stroke="#7c3aed" fill="#ede9fe" stroke-width="1.6"/><text x="496" y="474" font-size="9.5" font-weight="700" fill="#7c3aed" text-anchor="start">MSB</text><text x="856" y="474" font-size="9.5" font-weight="700" fill="#7c3aed" text-anchor="start">LSB</text><rect x="110" y="506" width="382" height="24" rx="4" fill="#dbeafe"/><text x="302" y="523" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">canal esquerdo · 16 bits (WS = 0)</text><rect x="494" y="506" width="382" height="24" rx="4" fill="#ede9fe"/><text x="686" y="523" font-size="12" font-weight="800" fill="#7c3aed" text-anchor="middle">canal direito · 16 bits (WS = 1)</text><path d="M86 414 C 86 470, 110 470, 114 474" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#ar)"/><text x="82" y="560" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="start">no padrão Philips o MSB começa 1 clock depois da troca de WS; no &quot;MSB justificado&quot; começa junto</text><text x="82" y="580" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">quadros podem ter 16 ou 32 bits por canal; o que sobra é preenchido com zeros</text><text x="24" y="624" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">3 · AS CONTAS DOS CLOCKS (Fs = 48 kHz)</text>
<rect x="24" y="640" width="466" height="170" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="44" y="668" font-size="12.5" font-weight="800" fill="#1e293b" text-anchor="start">Sinal</text><text x="154" y="668" font-size="12.5" font-weight="800" fill="#1e293b" text-anchor="start">Conta</text><text x="324" y="668" font-size="12.5" font-weight="800" fill="#1e293b" text-anchor="start">Valor</text><text x="44" y="692" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">WS</text><text x="154" y="692" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">= Fs</text><text x="324" y="692" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">48 kHz</text><text x="44" y="716" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">CK, 16 bits</text><text x="154" y="716" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">48 k × 16 × 2</text><text x="324" y="716" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">1,536 MHz</text><text x="44" y="740" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">CK, 32 bits</text><text x="154" y="740" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">48 k × 32 × 2</text><text x="324" y="740" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">3,072 MHz</text><text x="44" y="764" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">MCK</text><text x="154" y="764" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">256 × Fs</text><text x="324" y="764" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">12,288 MHz</text>
<text x="44" y="790" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="start">O PLL precisa gerar a base exata, ou o som deriva e estala.</text><rect x="510" y="640" width="466" height="170" rx="10" fill="#fffbeb" stroke="#f1d58a"/>
<text x="530" y="668" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">No H743</text><text x="670" y="668" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">I2S (SPI1–3)</text><text x="810" y="668" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">SAI1–4</text><text x="530" y="692" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">canais</text><text x="670" y="692" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">estéreo</text><text x="810" y="692" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">até 16 slots (TDM)</text><text x="530" y="716" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">quantos</text><text x="670" y="716" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">3</text><text x="810" y="716" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">4 (2 blocos cada)</text><text x="530" y="740" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">taxas</text><text x="670" y="740" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">8–192 kHz</text><text x="810" y="740" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">até 192 kHz</text><text x="530" y="764" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">uso típico</text><text x="670" y="764" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">DAC, mic, amp.</text><text x="810" y="764" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">codecs, TDM, PDM</text>
<g transform="translate(24 828)"><rect width="952" height="84" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/><text x="18" y="27" font-size="14" font-weight="800" fill="#14532d" text-anchor="start">I2S não é I2C</text><text x="18" y="50" font-size="13" font-weight="400" fill="#1e293b" text-anchor="start">Apesar do nome parecido, I2S transporta áudio em fluxo contínuo e sem endereço; I2C é um barramento de controle com endereços.</text><text x="18" y="70" font-size="13" font-weight="400" fill="#1e293b" text-anchor="start">Codecs costumam usar os dois: I2C para configurar volume e filtros, I2S para o som.</text></g>
</svg>
