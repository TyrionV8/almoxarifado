<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">USART: modos de ligação e recursos no STM32H743</title>
  <desc id="d">Quatro formas de ligar o USART3 da WeAct H743 (assíncrono, síncrono com CK, controle de fluxo RTS/CTS e RS-485 com DE), tabela USART x UART do DS12110 e pinos livres na placa.</desc>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
  <rect width="1000" height="860" fill="#ffffff"/>
<text x="24" y="34" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">1 · UM PERIFÉRICO, QUATRO FORMAS DE LIGAR (USART3 DA H743)</text>
<rect x="24" y="50" width="468" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="40" y="78" font-size="17" font-weight="800" fill="#1e293b" text-anchor="start">Assíncrono (igual a UART)</text>
<text x="40" y="98" font-size="12" font-weight="400" fill="#475569" text-anchor="start">só dados; cada lado gera o próprio tempo de bit</text><rect x="44" y="112" width="110" height="118" rx="8" fill="#0f3b2e"/><text x="99.0" y="167.0" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">H743</text><text x="99.0" y="187.0" font-size="11" font-weight="400" fill="#bbf7d0" text-anchor="middle">USART3</text>
<rect x="356" y="112" width="120" height="118" rx="8" fill="#334155"/><text x="416.0" y="167.0" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">módulo</text><text x="416.0" y="187.0" font-size="11" font-weight="400" fill="#cbd5e1" text-anchor="middle">GPS, CH343P…</text>
<path d="M154 140 H354" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ar)"/><text x="254" y="134" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">TX · PD8 → RX</text><path d="M354 175 H156" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#ar)"/><text x="254" y="169" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">RX · PD9 ← TX</text><path d="M154 210 H354" fill="none" stroke="#334155" stroke-width="2.5"/><text x="254" y="204" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">GND comum</text><rect x="508" y="50" width="468" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="524" y="78" font-size="17" font-weight="800" fill="#1e293b" text-anchor="start">Síncrono (só USART)</text>
<text x="524" y="98" font-size="12" font-weight="400" fill="#475569" text-anchor="start">o H743 também envia o clock: parece um SPI mestre</text><rect x="528" y="112" width="110" height="118" rx="8" fill="#0f3b2e"/><text x="583.0" y="167.0" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">H743</text><text x="583.0" y="187.0" font-size="11" font-weight="400" fill="#bbf7d0" text-anchor="middle">USART3</text>
<rect x="840" y="112" width="120" height="118" rx="8" fill="#334155"/><text x="900.0" y="159.0" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">periférico</text><text x="900.0" y="179.0" font-size="11" font-weight="400" fill="#cbd5e1" text-anchor="middle">registrador,</text><text x="900.0" y="195.0" font-size="11" font-weight="400" fill="#cbd5e1" text-anchor="middle">cartão…</text>
<path d="M638 132 H838" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#ar)"/><text x="738" y="126" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">CK · PD10 (clock)</text><path d="M638 164 H838" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ar)"/><text x="738" y="158" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">TX · PD8 (dados)</text><path d="M838 198 H640" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#ar)"/><text x="738" y="192" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">RX · PD9</text><rect x="24" y="266" width="468" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="40" y="294" font-size="17" font-weight="800" fill="#1e293b" text-anchor="start">Controle de fluxo RTS/CTS</text>
<text x="40" y="314" font-size="12" font-weight="400" fill="#475569" text-anchor="start">o receptor avisa quando o buffer está cheio</text><rect x="44" y="328" width="110" height="118" rx="8" fill="#0f3b2e"/><text x="99.0" y="383.0" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">H743</text><text x="99.0" y="403.0" font-size="11" font-weight="400" fill="#bbf7d0" text-anchor="middle">USART3</text>
<rect x="356" y="328" width="120" height="118" rx="8" fill="#334155"/><text x="416.0" y="375.0" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">modem</text><text x="416.0" y="395.0" font-size="11" font-weight="400" fill="#cbd5e1" text-anchor="middle">Bluetooth, Wi-Fi</text><text x="416.0" y="411.0" font-size="11" font-weight="400" fill="#cbd5e1" text-anchor="middle">(ESP-AT)…</text>
<path d="M154 348 H354" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ar)"/><text x="254" y="342" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">TX → RX</text><path d="M354 372 H156" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#ar)"/><text x="254" y="366" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">RX ← TX</text><path d="M154 400 H354" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#ar)"/><text x="254" y="394" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">RTS · PB14 → CTS</text><path d="M354 428 H156" fill="none" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ar)"/><text x="254" y="422" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">CTS · PB13 ← RTS</text><rect x="508" y="266" width="468" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="524" y="294" font-size="17" font-weight="800" fill="#1e293b" text-anchor="start">RS-485 com DE (Driver Enable)</text>
<text x="524" y="314" font-size="12" font-weight="400" fill="#475569" text-anchor="start">um par de fios, vários nós, até ~1 km</text><rect x="528" y="328" width="88" height="118" rx="8" fill="#0f3b2e"/><text x="572.0" y="383.0" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">H743</text><text x="572.0" y="403.0" font-size="11" font-weight="400" fill="#bbf7d0" text-anchor="middle">USART3</text>
<rect x="712" y="328" width="112" height="118" rx="8" fill="#475569"/><text x="768.0" y="375.0" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">transceptor</text><text x="768.0" y="395.0" font-size="11" font-weight="400" fill="#e2e8f0" text-anchor="middle">MAX485 /</text><text x="768.0" y="411.0" font-size="11" font-weight="400" fill="#e2e8f0" text-anchor="middle">SN65HVD</text>
<path d="M616 352 H710" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ar)"/><text x="663" y="346" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">TX</text><path d="M710 386 H618" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#ar)"/><text x="663" y="380" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">RX</text><path d="M616 424 H710" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#ar)"/><text x="663" y="418" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="middle">DE · PB14</text><path d="M824 368 H960 M824 406 H960" stroke="#334155" stroke-width="3"/><text x="892" y="360" font-size="12" font-weight="800" fill="#334155" text-anchor="middle">A</text><text x="892" y="426" font-size="12" font-weight="800" fill="#334155" text-anchor="middle">B</text><text x="892" y="446" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">par trançado · 120 Ω</text><text x="500" y="494" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">Os mesmos pinos PD8/PD9 servem aos quatro modos; o registrador de configuração do USART decide o comportamento.</text><text x="24" y="536" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">2 · USART × UART NO STM32H743 (DS12110, TABELA 6)</text>
<rect x="24" y="552" width="952" height="170" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="44" y="580" font-size="12.5" font-weight="800" fill="#1e293b" text-anchor="start">Recurso</text><text x="604" y="580" font-size="12.5" font-weight="800" fill="#1e293b" text-anchor="start">USART1/2/3/6</text><text x="804" y="580" font-size="12.5" font-weight="800" fill="#1e293b" text-anchor="start">UART4/5/7/8</text><text x="44" y="604" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">Assíncrono, 7/8/9 bits, até 12,5 Mbit/s</text><text x="604" y="604" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">sim</text><text x="804" y="604" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">sim</text><text x="44" y="628" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">Síncrono (pino CK) e modo SPI</text><text x="604" y="628" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">sim</text><text x="804" y="628" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">—</text><text x="44" y="652" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">Smartcard ISO 7816</text><text x="604" y="652" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">sim</text><text x="804" y="652" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">—</text><text x="44" y="676" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">RTS/CTS, RS-485 (DE), LIN, IrDA, Modbus</text><text x="604" y="676" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">sim</text><text x="804" y="676" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">sim</text><text x="44" y="700" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">FIFO de 16 posições, DMA, acorda do Stop</text><text x="604" y="700" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">sim</text><text x="804" y="700" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">sim</text>
<g transform="translate(24 740)"><rect width="952" height="80" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/><text x="18" y="27" font-size="14" font-weight="800" fill="#14532d" text-anchor="start">Na WeAct H743 (pinos livres nos headers)</text><text x="18" y="50" font-size="13" font-weight="400" fill="#1e293b" text-anchor="start">USART1: PA9 TX / PA10 RX, os mesmos do bootloader serial · USART3 completo: PD8 TX, PD9 RX, PD10 CK, PB13 CTS, PB14 RTS/DE</text><text x="18" y="70" font-size="13" font-weight="400" fill="#1e293b" text-anchor="start">UART7: PE8 TX, PE7 RX, PE9 DE · USART6 (PC6/PC7) e UART8 (PE0/PE1) dividem pinos com a câmera.</text></g>
</svg>
