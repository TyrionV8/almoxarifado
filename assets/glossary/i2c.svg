<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 960" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">I2C: barramento, transação e pull-ups</title>
  <desc id="d">Barramento I2C da WeAct H743 (I2C2 em PB10/PB11) com pull-ups e três sensores, leitura do registrador WHO_AM_I do MPU6050 passo a passo, forma de onda de START, bit, ACK e STOP e tabela de velocidades e resistores.</desc>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
  <rect width="1000" height="960" fill="#ffffff"/>
<text x="24" y="34" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">1 · DOIS FIOS, VÁRIOS DISPOSITIVOS, CADA UM COM SEU ENDEREÇO</text>
<rect x="24" y="50" width="952" height="270" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="44" y="120" width="140" height="150" rx="8" fill="#0f3b2e"/><text x="114.0" y="175.0" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">H743</text><text x="114.0" y="195.0" font-size="11" font-weight="400" fill="#bbf7d0" text-anchor="middle">I2C2</text><text x="114.0" y="211.0" font-size="11" font-weight="400" fill="#bbf7d0" text-anchor="middle">PB10 SCL</text><text x="114.0" y="227.0" font-size="11" font-weight="400" fill="#bbf7d0" text-anchor="middle">PB11 SDA</text>
<path d="M184 170 H940" stroke="#b45309" stroke-width="3.5"/><path d="M184 220 H940" stroke="#1d4ed8" stroke-width="3.5"/><text x="946" y="175" font-size="12" font-weight="800" fill="#b45309" text-anchor="start">SCL</text><text x="946" y="225" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="start">SDA</text><path d="M250 78 V96" stroke="#b91c1c" stroke-width="2"/><rect x="243" y="96" width="14" height="40" rx="2" fill="#fff" stroke="#b91c1c" stroke-width="2"/><path d="M250 136 V170" stroke="#b91c1c" stroke-width="2"/><circle cx="250" cy="170" r="4" fill="#b91c1c"/><path d="M300 78 V96" stroke="#b91c1c" stroke-width="2"/><rect x="293" y="96" width="14" height="40" rx="2" fill="#fff" stroke="#b91c1c" stroke-width="2"/><path d="M300 136 V220" stroke="#b91c1c" stroke-width="2"/><circle cx="300" cy="220" r="4" fill="#b91c1c"/><path d="M230 78 H320" stroke="#b91c1c" stroke-width="2"/><text x="275" y="70" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">3V3</text><text x="326" y="112" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="start">pull-ups 2,2–4,7 kΩ:</text><text x="326" y="128" font-size="11.5" font-weight="400" fill="#b91c1c" text-anchor="start">quem deixa a linha em 1</text><path d="M470 170 V252 M520 220 V252" stroke="#94a3b8" stroke-width="2"/><circle cx="470" cy="170" r="4" fill="#b45309"/><circle cx="520" cy="220" r="4" fill="#1d4ed8"/><rect x="430" y="252" width="130" height="56" rx="8" fill="#334155"/><text x="495.0" y="276.0" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">MPU6050</text><text x="495.0" y="296.0" font-size="11" font-weight="400" fill="#cbd5e1" text-anchor="middle">endereço 0x68</text>
<path d="M640 170 V252 M690 220 V252" stroke="#94a3b8" stroke-width="2"/><circle cx="640" cy="170" r="4" fill="#b45309"/><circle cx="690" cy="220" r="4" fill="#1d4ed8"/><rect x="600" y="252" width="130" height="56" rx="8" fill="#334155"/><text x="665.0" y="276.0" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">SSD1306</text><text x="665.0" y="296.0" font-size="11" font-weight="400" fill="#cbd5e1" text-anchor="middle">OLED · 0x3C</text>
<path d="M810 170 V252 M860 220 V252" stroke="#94a3b8" stroke-width="2"/><circle cx="810" cy="170" r="4" fill="#b45309"/><circle cx="860" cy="220" r="4" fill="#1d4ed8"/><rect x="770" y="252" width="130" height="56" rx="8" fill="#334155"/><text x="835.0" y="276.0" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">BMP280</text><text x="835.0" y="296.0" font-size="11" font-weight="400" fill="#cbd5e1" text-anchor="middle">pressão · 0x76</text>
<text x="500" y="344" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">Ninguém força 1: cada chip só puxa a linha para 0 (dreno aberto) e os resistores devolvem ao 1. Por isso vários podem dividir o fio.</text><text x="24" y="388" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">2 · LER O REGISTRADOR WHO_AM_I (0x75) DO MPU6050</text>
<rect x="44" y="408" width="31" height="34" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="59.5" y="430" font-size="13" font-weight="800" fill="#16a34a" text-anchor="middle">S</text><rect x="78" y="408" width="121" height="34" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/><text x="138.5" y="430" font-size="13" font-weight="800" fill="#1d4ed8" text-anchor="middle">0x68</text><text x="138.5" y="460" font-size="10.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">endereço 7 bits</text><rect x="202" y="408" width="31" height="34" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/><text x="217.5" y="430" font-size="13" font-weight="800" fill="#1d4ed8" text-anchor="middle">W</text><rect x="236" y="408" width="31" height="34" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/><text x="251.5" y="430" font-size="13" font-weight="800" fill="#0f766e" text-anchor="middle">A</text><rect x="270" y="408" width="121" height="34" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/><text x="330.5" y="430" font-size="13" font-weight="800" fill="#1d4ed8" text-anchor="middle">0x75</text><text x="330.5" y="460" font-size="10.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">registrador</text><rect x="394" y="408" width="31" height="34" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/><text x="409.5" y="430" font-size="13" font-weight="800" fill="#0f766e" text-anchor="middle">A</text><rect x="428" y="408" width="37" height="34" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="446.5" y="430" font-size="13" font-weight="800" fill="#16a34a" text-anchor="middle">Sr</text><text x="446.5" y="460" font-size="10.5" font-weight="700" fill="#16a34a" text-anchor="middle">repeated START</text><rect x="468" y="408" width="121" height="34" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/><text x="528.5" y="430" font-size="13" font-weight="800" fill="#1d4ed8" text-anchor="middle">0x68</text><text x="528.5" y="460" font-size="10.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">endereço</text><rect x="592" y="408" width="31" height="34" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/><text x="607.5" y="430" font-size="13" font-weight="800" fill="#1d4ed8" text-anchor="middle">R</text><rect x="626" y="408" width="31" height="34" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/><text x="641.5" y="430" font-size="13" font-weight="800" fill="#0f766e" text-anchor="middle">A</text><rect x="660" y="408" width="121" height="34" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="720.5" y="430" font-size="13" font-weight="800" fill="#7c3aed" text-anchor="middle">0x68</text><text x="720.5" y="460" font-size="10.5" font-weight="700" fill="#7c3aed" text-anchor="middle">dado do sensor</text><rect x="784" y="408" width="31" height="34" rx="5" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/><text x="799.5" y="430" font-size="13" font-weight="800" fill="#b91c1c" text-anchor="middle">N</text><rect x="818" y="408" width="31" height="34" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="833.5" y="430" font-size="13" font-weight="800" fill="#16a34a" text-anchor="middle">P</text><rect x="44" y="474" width="14" height="10" fill="#e2e8f0"/><text x="64" y="483" font-size="11" font-weight="400" fill="#475569" text-anchor="start">controlador envia</text><rect x="200" y="474" width="14" height="10" fill="#ede9fe" stroke="#7c3aed"/><text x="220" y="483" font-size="11" font-weight="400" fill="#475569" text-anchor="start">sensor envia (dado e ACKs dos endereços)</text><text x="520" y="483" font-size="11" font-weight="400" fill="#475569" text-anchor="start">A = ACK (0) · N = NACK (1): &quot;não quero mais bytes&quot;</text><text x="44" y="546" font-size="12.5" font-weight="800" fill="#1d4ed8" text-anchor="start">SDA</text><text x="44" y="606" font-size="12.5" font-weight="800" fill="#b45309" text-anchor="start">SCL</text><path d="M90 530 H150 V560 H210 V530 H330 V560 H700 V530 H940" fill="none" stroke="#1d4ed8" stroke-width="2.4"/><path d="M90 590 H180 V620 H240 V590 H300 V620 H360 V590 H420 V620 H510 V590 H570 V620 H630 V590 H940" fill="none" stroke="#b45309" stroke-width="2.4"/><text x="150" y="650" font-size="11" font-weight="800" fill="#16a34a" text-anchor="middle">START: SDA desce</text><text x="150" y="665" font-size="11" font-weight="400" fill="#16a34a" text-anchor="middle">com SCL em 1</text><text x="270" y="650" font-size="11" font-weight="800" fill="#1d4ed8" text-anchor="middle">bit 1: SDA parado</text><text x="270" y="665" font-size="11" font-weight="400" fill="#1d4ed8" text-anchor="middle">enquanto SCL = 1</text><text x="390" y="650" font-size="11" font-weight="800" fill="#1d4ed8" text-anchor="middle">bit 0</text><text x="540" y="650" font-size="11" font-weight="800" fill="#0f766e" text-anchor="middle">ACK: o receptor</text><text x="540" y="665" font-size="11" font-weight="400" fill="#0f766e" text-anchor="middle">segura SDA em 0</text><text x="700" y="650" font-size="11" font-weight="800" fill="#16a34a" text-anchor="middle">STOP: SDA sobe</text><text x="700" y="665" font-size="11" font-weight="400" fill="#16a34a" text-anchor="middle">com SCL em 1</text><text x="840" y="558" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">SDA só muda com SCL em 0;</text><text x="840" y="574" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">mudar com SCL em 1 = START/STOP</text><path d="M455 524 V626" stroke="#94a3b8" stroke-dasharray="3 3"/><text x="462" y="522" font-size="10" font-weight="700" fill="#0f766e" text-anchor="start">o sensor assume SDA</text><text x="24" y="708" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">3 · VELOCIDADE × RESISTOR DE PULL-UP</text>
<rect x="24" y="724" width="952" height="144" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="44" y="752" font-size="12.5" font-weight="800" fill="#1e293b" text-anchor="start">Modo</text><text x="194" y="752" font-size="12.5" font-weight="800" fill="#1e293b" text-anchor="start">Velocidade</text><text x="324" y="752" font-size="12.5" font-weight="800" fill="#1e293b" text-anchor="start">Subida máx.</text><text x="454" y="752" font-size="12.5" font-weight="800" fill="#1e293b" text-anchor="start">Pull-up típico (3,3 V, fio curto)</text><text x="754" y="752" font-size="12.5" font-weight="800" fill="#1e293b" text-anchor="start">No H743</text><text x="44" y="776" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">Standard</text><text x="194" y="776" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">100 kbit/s</text><text x="324" y="776" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">1000 ns</text><text x="454" y="776" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">4,7–10 kΩ</text><text x="754" y="776" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">todos os I2C</text><text x="44" y="800" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">Fast</text><text x="194" y="800" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">400 kbit/s</text><text x="324" y="800" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">300 ns</text><text x="454" y="800" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">2,2–4,7 kΩ</text><text x="754" y="800" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">todos os I2C</text><text x="44" y="824" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">Fast-mode Plus</text><text x="194" y="824" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">1 Mbit/s</text><text x="324" y="824" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">120 ns</text><text x="454" y="824" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">≈ 1 kΩ (saída de 20 mA)</text><text x="754" y="824" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">pinos FT_f</text>
<text x="44" y="852" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="start">Resistor alto: subida lenta e bits perdidos. Resistor baixo: o chip não consegue levar a linha a 0 (mínimo ≈ 1 kΩ com 3 mA).</text><g transform="translate(24 882)"><rect width="952" height="66" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/><text x="18" y="27" font-size="14" font-weight="800" fill="#14532d" text-anchor="start">Na WeAct H743</text><text x="18" y="50" font-size="13" font-weight="400" fill="#1e293b" text-anchor="start">I2C2 livre em PB10 (SCL) e PB11 (SDA), pinos Fast-mode Plus. O I2C1 em PB8/PB9 é o barramento da câmera e já tem pull-ups de 4,7 kΩ.</text></g>
</svg>
