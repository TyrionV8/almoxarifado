<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">LPUART: UART que funciona com o chip em Stop</title>
  <desc id="d">Diagrama de domínios do H743 com LSE e LPUART1 acordados no modo Stop, consumo ao longo do tempo, cálculo do baud rate com 32,768 kHz, comparação com USART e pinos na WeAct H743.</desc>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
  <rect width="1000" height="900" fill="#ffffff"/>
<text x="24" y="34" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">1 · QUEM FICA ACORDADO NO MODO STOP</text>
<rect x="24" y="50" width="952" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="44" y="74" width="280" height="186" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="6 5"/><text x="60" y="98" font-size="13" font-weight="800" fill="#475569" text-anchor="start">Domínios D1 e D2 · dormindo</text><rect x="84" y="118" width="200" height="116" rx="8" fill="#94a3b8"/><text x="184.0" y="164.0" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">Cortex-M7</text><text x="184.0" y="184.0" font-size="11" font-weight="400" fill="#f1f5f9" text-anchor="middle">clock parado</text><text x="184.0" y="200.0" font-size="11" font-weight="400" fill="#f1f5f9" text-anchor="middle">RAM preservada</text>
<rect x="420" y="74" width="300" height="186" rx="10" fill="#f0fdf4" stroke="#16a34a"/><text x="436" y="98" font-size="13" font-weight="800" fill="#16a34a" text-anchor="start">Domínio D3 · continua ligado</text><rect x="460" y="118" width="220" height="116" rx="8" fill="#0f3b2e"/><text x="570.0" y="164.0" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">LPUART1</text><text x="570.0" y="184.0" font-size="11" font-weight="400" fill="#bbf7d0" text-anchor="middle">clock próprio</text><text x="570.0" y="200.0" font-size="11" font-weight="400" fill="#bbf7d0" text-anchor="middle">FIFO + detecção de start</text>
<rect x="790" y="84" width="166" height="66" rx="8" fill="#334155"/><text x="873.0" y="113.0" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">LSE 32,768 kHz</text><text x="873.0" y="133.0" font-size="11" font-weight="400" fill="#cbd5e1" text-anchor="middle">cristal PC14/PC15</text>
<path d="M790 118 H684" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#ar)"/><text x="737" y="110" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">clock</text><rect x="790" y="176" width="166" height="70" rx="8" fill="#475569"/><text x="873.0" y="207.0" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">sensor · GPS</text><text x="873.0" y="227.0" font-size="11" font-weight="400" fill="#e2e8f0" text-anchor="middle">modem · outro MCU</text>
<path d="M790 212 H684" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#ar)"/><text x="737" y="204" font-size="11.5" font-weight="700" fill="#7c3aed" text-anchor="middle">RX · PA10</text><path d="M458 176 H290" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#ar)"/><text x="374" y="166" font-size="12" font-weight="800" fill="#16a34a" text-anchor="middle">acorda a CPU</text><text x="374" y="196" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">start bit, qualquer quadro,</text><text x="374" y="211" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">um byte programado ou FIFO</text><text x="24" y="322" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">2 · CONSUMO AO LONGO DO TEMPO</text>
<rect x="24" y="338" width="952" height="210" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="44" y="372" font-size="12" font-weight="700" fill="#475569" text-anchor="start">corrente</text><path d="M60 520 V376" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ar)"/><path d="M60 520 H956" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ar)"/><text x="940" y="540" font-size="12" font-weight="700" fill="#475569" text-anchor="end">tempo</text><path d="M60 380 H200 V500 H560 V380 H660 V500 H930" fill="none" stroke="#1d4ed8" stroke-width="3"/><rect x="60" y="380" width="140" height="120" fill="#dbeafe" opacity=".6"/><rect x="560" y="380" width="100" height="120" fill="#dbeafe" opacity=".6"/><text x="130" y="430" font-size="14" font-weight="800" fill="#1d4ed8" text-anchor="middle">Run</text><text x="130" y="450" font-size="11.5" font-weight="400" fill="#1d4ed8" text-anchor="middle">processa</text><text x="380" y="486" font-size="12" font-weight="700" fill="#16a34a" text-anchor="middle">Stop: só o D3 e o LSE — consumo muito menor</text><text x="610" y="430" font-size="14" font-weight="800" fill="#1d4ed8" text-anchor="middle">Run</text><text x="610" y="450" font-size="11.5" font-weight="400" fill="#1d4ed8" text-anchor="middle">trata o dado</text><text x="795" y="486" font-size="12" font-weight="700" fill="#16a34a" text-anchor="middle">Stop de novo</text><text x="466" y="396" font-size="11.5" font-weight="700" fill="#7c3aed" text-anchor="end">quadro chega em RX</text><path d="M410 404 H470 V420 H482 V404 H494 V420 H518 V404 H540" fill="none" stroke="#7c3aed" stroke-width="2"/><path d="M500 426 C 530 450, 530 440, 556 410" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#ar)"/><text x="24" y="590" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">3 · VELOCIDADE COM O CRISTAL DE 32,768 kHz</text>
<rect x="24" y="606" width="466" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="44" y="634" font-size="13" font-weight="800" fill="#1e293b" text-anchor="start">Divisor fracionário: BRR = 256 × f_clock / baud</text><text x="44" y="660" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">9600 bit/s → BRR = 256 × 32 768 / 9600 ≈ 874</text><text x="44" y="682" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">baud real = 256 × 32 768 / 874 ≈ 9598 (erro 0,02 %)</text><text x="44" y="710" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">BRR mínimo = 0x300 (768) → baud ≤ f_clock / 3</text><text x="44" y="734" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="start">com LSE: até 9600 · 19 200 ou mais: HSI, CSI ou PCLK4</text><text x="44" y="760" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">o erro vem só do arredondamento do BRR</text><rect x="510" y="606" width="466" height="180" rx="10" fill="#fffbeb" stroke="#f1d58a"/>
<text x="530" y="634" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">Recurso no H743</text><text x="760" y="634" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">LPUART1</text><text x="850" y="634" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">USART</text><text x="530" y="658" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">domínio D3 (roda sem D1/D2)</text><text x="760" y="658" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">sim</text><text x="850" y="658" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">— (D2)</text><text x="530" y="682" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">RTS/CTS, DE, half-duplex, FIFO</text><text x="760" y="682" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">sim</text><text x="850" y="682" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">sim</text><text x="530" y="706" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">síncrono, LIN, IrDA, Smartcard</text><text x="760" y="706" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">—</text><text x="850" y="706" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">sim</text><text x="530" y="730" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">autobaud, timeout (Modbus)</text><text x="760" y="730" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">—</text><text x="850" y="730" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">sim</text><text x="530" y="754" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">quantos</text><text x="760" y="754" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">1</text><text x="850" y="754" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">4 + 4 UART</text>
<g transform="translate(24 804)"><rect width="952" height="84" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/><text x="18" y="27" font-size="14" font-weight="800" fill="#14532d" text-anchor="start">Na WeAct H743</text><text x="18" y="50" font-size="13" font-weight="400" fill="#1e293b" text-anchor="start">LPUART1_TX/RX em PA9/PA10 (AF3) — os mesmos pinos do USART1 (AF7), por isso só um dos dois usa o par de cada vez.</text><text x="18" y="70" font-size="13" font-weight="400" fill="#1e293b" text-anchor="start">Alternativa: PB6/PB7 (AF8), mas eles já são o CS da flash QSPI e o VSYNC da câmera.</text></g>
</svg>
