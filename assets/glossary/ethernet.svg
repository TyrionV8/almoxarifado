<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 920" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Ethernet: MAC, RMII, PHY e quadro</title>
  <desc id="d">Cadeia do Ethernet do MAC do H743 ao conector RJ45 passando por RMII, PHY LAN8720 e transformador, os 9 sinais RMII disponíveis nos headers da WeAct H743, estrutura do quadro Ethernet e pilha de software LwIP.</desc>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
  <rect width="1000" height="920" fill="#ffffff"/>
<text x="24" y="34" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">1 · DO MICROCONTROLADOR AO CABO: MAC → RMII → PHY → TRANSFORMADOR → RJ45</text>
<rect x="24" y="50" width="952" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="44" y="80" width="150" height="130" rx="8" fill="#0f3b2e"/><text x="119.0" y="133.0" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">H743</text><text x="119.0" y="153.0" font-size="11" font-weight="400" fill="#bbf7d0" text-anchor="middle">MAC 10/100</text><text x="119.0" y="169.0" font-size="11" font-weight="400" fill="#bbf7d0" text-anchor="middle">DMA + FIFO 2 KiB</text>
<rect x="310" y="80" width="150" height="130" rx="8" fill="#334155"/><text x="385.0" y="133.0" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">PHY</text><text x="385.0" y="153.0" font-size="11" font-weight="400" fill="#cbd5e1" text-anchor="middle">LAN8720 ou</text><text x="385.0" y="169.0" font-size="11" font-weight="400" fill="#cbd5e1" text-anchor="middle">DP83848</text>
<rect x="560" y="80" width="130" height="130" rx="8" fill="#475569"/><text x="625.0" y="133.0" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">transformador</text><text x="625.0" y="153.0" font-size="11" font-weight="400" fill="#e2e8f0" text-anchor="middle">isolação</text><text x="625.0" y="169.0" font-size="11" font-weight="400" fill="#e2e8f0" text-anchor="middle">(&quot;magnetics&quot;)</text>
<rect x="780" y="80" width="90" height="130" rx="8" fill="#64748b"/><text x="825.0" y="141.0" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">RJ45</text><text x="825.0" y="161.0" font-size="11" font-weight="400" fill="#f1f5f9" text-anchor="middle">conector</text>
<path d="M194 118 H308" fill="none" stroke="#1d4ed8" stroke-width="3" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="251" y="110" font-size="12.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">RMII</text><text x="251" y="136" font-size="10.5" font-weight="400" fill="#1d4ed8" text-anchor="middle">9 fios, 50 MHz</text><path d="M194 180 H308" fill="none" stroke="#0f766e" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="251" y="172" font-size="11" font-weight="800" fill="#0f766e" text-anchor="middle">MDIO/MDC</text><text x="251" y="198" font-size="10.5" font-weight="400" fill="#0f766e" text-anchor="middle">registradores</text><path d="M460 145 H558" fill="none" stroke="#b45309" stroke-width="3" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="509" y="137" font-size="11" font-weight="800" fill="#b45309" text-anchor="middle">TX± RX±</text><text x="509" y="163" font-size="10.5" font-weight="400" fill="#b45309" text-anchor="middle">sinal analógico</text><path d="M690 145 H778" fill="none" stroke="#475569" stroke-width="3" marker-start="url(#ar)" marker-end="url(#ar)"/><path d="M870 145 H952" fill="none" stroke="#475569" stroke-width="4" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="911" y="128" font-size="11" font-weight="800" fill="#475569" text-anchor="middle">cabo</text><text x="911" y="170" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">até 100 m</text><path d="M44 224 H460" stroke="#16a34a" stroke-width="2"/><text x="252" y="244" font-size="11.5" font-weight="800" fill="#16a34a" text-anchor="middle">digital · perto do chip</text><path d="M470 224 H952" stroke="#b45309" stroke-width="2"/><text x="711" y="244" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">analógico · isolado · pode ir longe</text><text x="500" y="262" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">A WeAct H743 tem só o MAC: PHY, transformador e RJ45 vêm juntos num módulo externo (ex.: LAN8720).</text><text x="24" y="322" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">2 · RMII DA H743 NOS HEADERS (TODOS OS 9 SINAIS DISPONÍVEIS)</text>
<rect x="24" y="338" width="952" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="44" y="366" font-size="12.5" font-weight="800" fill="#1e293b" text-anchor="start">Sinal</text><text x="214" y="366" font-size="12.5" font-weight="800" fill="#1e293b" text-anchor="start">Pino</text><text x="354" y="366" font-size="12.5" font-weight="800" fill="#1e293b" text-anchor="start">Função</text><text x="44" y="389" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">REF_CLK</text><text x="214" y="389" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">PA1</text><text x="354" y="389" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">50 MHz vindo do módulo PHY (entrada)</text><text x="44" y="412" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">CRS_DV</text><text x="214" y="412" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">PA7</text><text x="354" y="412" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">dado recebido válido · ⚠ é o PWDN da câmera (SB1)</text><text x="44" y="435" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">RXD0 · RXD1</text><text x="214" y="435" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">PC4 · PC5</text><text x="354" y="435" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">dados recebidos, 2 bits por clock</text><text x="44" y="458" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">TX_EN</text><text x="214" y="458" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">PB11</text><text x="354" y="458" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">habilita a transmissão</text><text x="44" y="481" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">TXD0 · TXD1</text><text x="214" y="481" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">PB12 · PB13</text><text x="354" y="481" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">dados transmitidos, 2 bits por clock</text><text x="44" y="504" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">MDIO · MDC</text><text x="214" y="504" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">PA2 · PC1</text><text x="354" y="504" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">gerência: ler e configurar o PHY</text>
<text x="44" y="528" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="start">2 bits × 50 MHz = 100 Mbit/s. Fios curtos (&lt; 10 cm) e GND junto; o REF_CLK é o sinal mais sensível.</text><text x="24" y="580" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">3 · UM QUADRO ETHERNET E O QUE VAI DENTRO</text>
<rect x="44" y="600" width="107" height="40" rx="5" fill="#f1f5f9" stroke="#475569"/><text x="97.5" y="624" font-size="11.5" font-weight="800" fill="#475569" text-anchor="middle">preâmb. + SFD</text><text x="97.5" y="658" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">8 B</text><rect x="154" y="600" width="97" height="40" rx="5" fill="#dbeafe" stroke="#1d4ed8"/><text x="202.5" y="624" font-size="11.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">destino</text><text x="202.5" y="658" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">6 B MAC</text><rect x="254" y="600" width="97" height="40" rx="5" fill="#dbeafe" stroke="#1d4ed8"/><text x="302.5" y="624" font-size="11.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">origem</text><text x="302.5" y="658" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">6 B MAC</text><rect x="354" y="600" width="57" height="40" rx="5" fill="#fef3c7" stroke="#b45309"/><text x="382.5" y="624" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">tipo</text><text x="382.5" y="658" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">2 B</text><rect x="414" y="600" width="387" height="40" rx="5" fill="#ede9fe" stroke="#7c3aed"/><text x="607.5" y="624" font-size="11.5" font-weight="800" fill="#7c3aed" text-anchor="middle">dados (IP → TCP/UDP → aplicação)</text><text x="607.5" y="658" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">46–1500 B</text><rect x="804" y="600" width="67" height="40" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="837.5" y="624" font-size="11.5" font-weight="800" fill="#16a34a" text-anchor="middle">FCS</text><text x="837.5" y="658" font-size="11" font-weight="700" fill="#16a34a" text-anchor="middle">CRC 4 B</text><text x="44" y="690" font-size="12" font-weight="700" fill="#1e293b" text-anchor="start">O MAC monta e confere o quadro (endereços, CRC). Tudo acima dele é software:</text><rect x="44" y="704" width="170" height="36" rx="6" fill="#fff" stroke="#1d4ed8" stroke-width="2"/><text x="129" y="727" font-size="11.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">driver ETH + DMA</text><path d="M216 722 H230" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ar)"/><rect x="232" y="704" width="170" height="36" rx="6" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="317" y="727" font-size="11.5" font-weight="800" fill="#0f766e" text-anchor="middle">LwIP (pilha TCP/IP)</text><path d="M404 722 H418" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#ar)"/><rect x="420" y="704" width="170" height="36" rx="6" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="505" y="727" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">IP · ARP · DHCP</text><path d="M592 722 H606" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#ar)"/><rect x="608" y="704" width="170" height="36" rx="6" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="693" y="727" font-size="11.5" font-weight="800" fill="#7c3aed" text-anchor="middle">TCP · UDP</text><path d="M780 722 H794" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#ar)"/><rect x="796" y="704" width="170" height="36" rx="6" fill="#fff" stroke="#16a34a" stroke-width="2"/><text x="881" y="727" font-size="11.5" font-weight="800" fill="#16a34a" text-anchor="middle">HTTP · MQTT · Modbus</text><g transform="translate(24 770)"><rect width="952" height="104" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/><text x="18" y="27" font-size="14" font-weight="800" fill="#14532d" text-anchor="start">No STM32H743</text><text x="18" y="50" font-size="13" font-weight="400" fill="#1e293b" text-anchor="start">MAC IEEE 802.3 de 10/100 Mbit/s com MII ou RMII, DMA próprio, FIFOs de 2 KiB, filtro de endereços, VLAN e relógio PTP (IEEE 1588).</text><text x="18" y="70" font-size="13" font-weight="400" fill="#1e293b" text-anchor="start">O DMA do Ethernet não alcança a DTCM: descritores e buffers ficam na SRAM do domínio D2, com a região configurada no MPU</text><text x="18" y="90" font-size="13" font-weight="400" fill="#1e293b" text-anchor="start">(padrão dos exemplos da ST; confira no RM0433). RMII usa 9 sinais contra 17 do MII: é a escolha comum.</text></g>
<text x="500" y="900" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">RMII: Reduced Media-Independent Interface · MDIO: Management Data Input/Output · FCS: Frame Check Sequence</text></svg>
