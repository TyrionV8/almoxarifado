<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 960" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ADC: caminho do sinal, resolução e amostragem</title>
  <desc id="d">Caminho do sinal no ADC do STM32H743 (fonte, pino, multiplexador, amostragem, conversor SAR e DMA), fórmula do código, degraus de quantização, comparação entre 16 bits nominais e ENOB medido, curva de carga do capacitor de amostragem e taxas máximas por tipo de canal.</desc>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
  <rect width="1000" height="960" fill="#ffffff"/>
<text x="24" y="34" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">1 · DA TENSÃO AO NÚMERO: O CAMINHO DENTRO DO ADC</text>
<rect x="24" y="50" width="952" height="240" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="44" y="80" width="110" height="80" rx="8" fill="#334155"/><text x="99.0" y="116" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">sensor</text><text x="99.0" y="136" font-size="10.5" font-weight="400" fill="#e2e8f0" text-anchor="middle">fonte + R da fonte</text><rect x="184" y="80" width="120" height="80" rx="8" fill="#64748b"/><text x="244.0" y="116" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">pino</text><text x="244.0" y="136" font-size="10.5" font-weight="400" fill="#e2e8f0" text-anchor="middle">PA0 · ADC1_INP16</text><rect x="334" y="80" width="100" height="80" rx="8" fill="#475569"/><text x="384.0" y="116" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">mux</text><text x="384.0" y="136" font-size="10.5" font-weight="400" fill="#e2e8f0" text-anchor="middle">escolhe o canal</text><rect x="464" y="80" width="110" height="80" rx="8" fill="#b45309"/><text x="519.0" y="116" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">S/H</text><text x="519.0" y="136" font-size="10.5" font-weight="400" fill="#e2e8f0" text-anchor="middle">capacitor 4 pF</text><rect x="604" y="80" width="130" height="80" rx="8" fill="#0f3b2e"/><text x="669.0" y="116" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">SAR 16 bits</text><text x="669.0" y="136" font-size="10.5" font-weight="400" fill="#e2e8f0" text-anchor="middle">compara bit a bit</text><rect x="764" y="80" width="150" height="80" rx="8" fill="#1d4ed8"/><text x="839.0" y="116" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">DMA → RAM</text><text x="839.0" y="136" font-size="10.5" font-weight="400" fill="#e2e8f0" text-anchor="middle">sem a CPU</text><path d="M154 120 H182" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#ar)"/><path d="M304 120 H332" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#ar)"/><path d="M434 120 H462" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#ar)"/><path d="M574 120 H602" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#ar)"/><path d="M734 120 H762" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#ar)"/><text x="500" y="184" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">1) amostra: o capacitor</text><text x="500" y="200" font-size="11.5" font-weight="400" fill="#b45309" text-anchor="middle">carrega durante tS</text><text x="700" y="184" font-size="11.5" font-weight="700" fill="#16a34a" text-anchor="middle">2) converte: busca</text><text x="700" y="200" font-size="11.5" font-weight="400" fill="#16a34a" text-anchor="middle">binária, 1 bit por ciclo</text><rect x="44" y="218" width="912" height="54" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="64" y="242" font-size="14" font-weight="800" fill="#1e293b" text-anchor="start">código = V_entrada ÷ VREF+ × (2ᴺ − 1)</text><text x="64" y="262" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">1,65 V com VREF+ = 3,3 V → 32 767 em 16 bits · 2047 em 12 bits · 1 LSB = 3,3 V ÷ 65 536 ≈ 50 µV (16 bits) ou 806 µV (12 bits)</text><text x="24" y="332" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">2 · RESOLUÇÃO NÃO É PRECISÃO</text>
<rect x="24" y="348" width="466" height="260" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<path d="M70 580 H378" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ar)"/><path d="M70 580 V352" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ar)"/><path d="M70 580 L358 372" stroke="#94a3b8" stroke-dasharray="4 4"/><path d="M70 580 V580 H106 V554 H142 V528 H178 V502 H214 V476 H250 V450 H286 V424 H322 V398 H358" fill="none" stroke="#1d4ed8" stroke-width="2.4"/><text x="214" y="600" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">tensão de entrada →</text><text x="78" y="366" font-size="11" font-weight="700" fill="#475569" text-anchor="start">código</text><text x="94" y="398" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="start">exemplo com 3 bits: 8 degraus,</text><text x="94" y="414" font-size="11" font-weight="400" fill="#1d4ed8" text-anchor="start">cada degrau = 1 LSB</text><rect x="510" y="348" width="466" height="260" rx="10" fill="#fffbeb" stroke="#f1d58a"/>
<text x="530" y="376" font-size="12.5" font-weight="800" fill="#1e293b" text-anchor="start">STM32H743 rev V, 16 bits (DS12110, tab. 186)</text><text x="530" y="418" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="start">bits nominais</text><rect x="680" y="404" width="256" height="22" rx="4" fill="#1d4ed8"/><text x="942" y="420" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="start">16</text><text x="530" y="462" font-size="11.5" font-weight="700" fill="#7c3aed" text-anchor="start">ENOB diferencial</text><rect x="680" y="448" width="211.2" height="22" rx="4" fill="#7c3aed"/><text x="897.2" y="464" font-size="12" font-weight="800" fill="#7c3aed" text-anchor="start">13,2</text><text x="530" y="506" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="start">ENOB single-ended</text><rect x="680" y="492" width="195.2" height="22" rx="4" fill="#b45309"/><text x="881.2" y="508" font-size="12" font-weight="800" fill="#b45309" text-anchor="start">12,2</text><text x="530" y="548" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start">ENOB = bits efetivos depois de ruído e distorção.</text><text x="530" y="566" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start">Os últimos 3–4 bits variam de leitura para leitura:</text><text x="530" y="584" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="start">use média, sobreamostragem ou entrada diferencial.</text><text x="24" y="650" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">3 · TEMPO DE AMOSTRAGEM E TAXA</text>
<rect x="24" y="666" width="466" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<path d="M60 800 H360" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ar)"/><path d="M60 800 V690" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ar)"/><polyline points="60,800.0 66,778.7 72,761.9 78,748.7 84,738.3 90,730.1 96,723.7 102,718.6 108,714.7 114,711.5 120,709.1 126,707.1 132,705.6 138,704.4 144,703.5 150,702.7 156,702.2 162,701.7 168,701.3 174,701.0 180,700.8 186,700.6 192,700.5 198,700.4 204,700.3 210,700.2 216,700.2 222,700.2 228,700.1 234,700.1 240,700.1 246,700.1 252,700.0 258,700.0 264,700.0 270,700.0 276,700.0 282,700.0 288,700.0 294,700.0 300,700.0 306,700.0 312,700.0 318,700.0 324,700.0 330,700.0 336,700.0 342,700.0 348,700.0 354,700.0" fill="none" stroke="#16a34a" stroke-width="2.4"/><polyline points="60,800.0 66,792.8 72,786.1 78,779.9 84,774.1 90,768.7 96,763.8 102,759.2 108,754.9 114,750.9 120,747.2 126,743.8 132,740.7 138,737.7 144,735.0 150,732.5 156,730.1 162,727.9 168,725.9 174,724.1 180,722.3 186,720.7 192,719.2 198,717.8 204,716.5 210,715.3 216,714.2 222,713.2 228,712.2 234,711.4 240,710.5 246,709.8 252,709.1 258,708.4 264,707.8 270,707.2 276,706.7 282,706.2 288,705.8 294,705.4 300,705.0 306,704.6 312,704.3 318,704.0 324,703.7 330,703.4 336,703.2 342,702.9 348,702.7 354,702.5" fill="none" stroke="#b91c1c" stroke-width="2.4"/><path d="M180 800 V690" stroke="#475569" stroke-dasharray="4 4"/><text x="180" y="816" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">fim da amostragem</text><circle cx="180" cy="701" r="4" fill="#16a34a"/><circle cx="180" cy="722" r="4" fill="#b91c1c"/><text x="190" y="684" font-size="10.5" font-weight="700" fill="#16a34a" text-anchor="start">baixa impedância: valor certo</text><text x="190" y="750" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="start">alta impedância: ainda não</text><text x="190" y="764" font-size="10.5" font-weight="400" fill="#b91c1c" text-anchor="start">carregou → leitura baixa</text><text x="44" y="842" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Fonte &quot;fraca&quot; (divisor de 100 kΩ, sensor): aumente o tempo ou use um buffer.</text><rect x="510" y="666" width="466" height="180" rx="10" fill="#fffbeb" stroke="#f1d58a"/>
<text x="530" y="694" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">Taxa máxima (rev V)</text><text x="720" y="694" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">16 bits</text><text x="830" y="694" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">12 bits</text><text x="530" y="718" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">canais diretos</text><text x="720" y="718" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">3,6 MSPS</text><text x="830" y="718" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">5,5 MSPS</text><text x="530" y="742" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">canais rápidos</text><text x="720" y="742" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">2,9 MSPS</text><text x="830" y="742" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">4,3 MSPS</text><text x="530" y="766" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">canais lentos</text><text x="720" y="766" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">1 MSPS</text><text x="830" y="766" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">1 MSPS</text>
<text x="530" y="790" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start">Amostre a mais que 2× a maior frequência do sinal</text><text x="530" y="808" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start">(Nyquist) e filtre antes (RC) para não haver aliasing.</text><text x="530" y="830" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Qual pino é direto, rápido ou lento: manual RM0433.</text><g transform="translate(24 862)"><rect width="952" height="86" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/><text x="18" y="27" font-size="14" font-weight="800" fill="#14532d" text-anchor="start">Na WeAct H743</text><text x="18" y="50" font-size="13" font-weight="400" fill="#1e293b" text-anchor="start">Entradas livres: PA0–PA3, PA5, PB0, PB1, PC0, PC1, PC4, PC5 e os pads analógicos PC2_C/PC3_C. VREF+ = 3V3 pelo R9 (0 Ω).</text><text x="18" y="70" font-size="13" font-weight="400" fill="#1e293b" text-anchor="start">Calibre o ADC ao ligar (HAL_ADCEx_Calibration_Start) e use tensão de 0 a 3,3 V: acima disso, divisor resistivo.</text></g>
</svg>
