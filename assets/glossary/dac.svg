<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 960" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">DAC: do número à tensão e geração de ondas</title>
  <desc id="d">Caminho do DAC do STM32H743 com fórmula da tensão e faixas de saída com buffer ligado e desligado, geração de seno com timer, DMA e tabela, efeito do filtro RC e comparação entre DAC e PWM filtrado.</desc>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
  <rect width="1000" height="960" fill="#ffffff"/>
<text x="24" y="34" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">1 · DO NÚMERO À TENSÃO</text>
<rect x="24" y="50" width="952" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="44" y="76" width="150" height="70" rx="8" fill="#0f3b2e"/><text x="119.0" y="106" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">código 12 bits</text><text x="119.0" y="126" font-size="10.5" font-weight="400" fill="#e2e8f0" text-anchor="middle">0 a 4095</text><rect x="234" y="76" width="150" height="70" rx="8" fill="#334155"/><text x="309.0" y="106" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">conversor</text><text x="309.0" y="126" font-size="10.5" font-weight="400" fill="#e2e8f0" text-anchor="middle">rede de resistores</text><rect x="424" y="76" width="130" height="70" rx="8" fill="#b45309"/><text x="489.0" y="106" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">buffer</text><text x="489.0" y="126" font-size="10.5" font-weight="400" fill="#e2e8f0" text-anchor="middle">liga ou desliga</text><rect x="594" y="76" width="150" height="70" rx="8" fill="#64748b"/><text x="669.0" y="106" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">pino</text><text x="669.0" y="126" font-size="10.5" font-weight="400" fill="#e2e8f0" text-anchor="middle">PA5 · DAC1_OUT2</text><path d="M194 111 H232" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#ar)"/><path d="M384 111 H422" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#ar)"/><path d="M554 111 H592" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#ar)"/><path d="M744 111 H790" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#ar)"/><rect x="792" y="76" width="164" height="70" rx="8" fill="#475569"/><text x="874.0" y="107.0" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">carga</text><text x="874.0" y="127.0" font-size="11" font-weight="400" fill="#e2e8f0" text-anchor="middle">≥ 5 kΩ com buffer</text>
<rect x="44" y="160" width="912" height="40" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="64" y="186" font-size="13" font-weight="800" fill="#1e293b" text-anchor="start">V_saída = VREF+ × código ÷ 4095   ·   código 2048 → 1,65 V   ·   1 degrau ≈ 0,8 mV com VREF+ = 3,3 V</text><text x="64" y="232" font-size="12" font-weight="800" fill="#b45309" text-anchor="start">buffer ligado</text><text x="64" y="268" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="start">buffer desligado</text><rect x="250" y="220" width="600" height="18" rx="3" fill="#f1f5f9"/><rect x="286" y="220" width="527" height="18" rx="3" fill="#b45309"/><rect x="250" y="256" width="600" height="18" rx="3" fill="#1d4ed8"/><text x="242" y="290" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">0 V</text><text x="850" y="290" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">3,3 V</text><text x="550.0" y="234" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">0,2 V a VDDA − 0,2 V · aguenta carga de 5 kΩ</text><text x="550.0" y="270" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">0 a VREF+ · mas a saída tem ~13 kΩ: só alimenta entradas de alta impedância</text><text x="24" y="342" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">2 · GERAR UMA ONDA: TIMER + DMA + TABELA</text>
<rect x="24" y="358" width="952" height="270" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="44" y="378" width="200" height="50" rx="8" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="144" y="400" font-size="13" font-weight="800" fill="#b45309" text-anchor="middle">TIM6</text><text x="144" y="418" font-size="10.5" font-weight="400" fill="#b45309" text-anchor="middle">dispara a cada 1 µs</text><path d="M246 403 H270" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#ar)"/><rect x="274" y="378" width="200" height="50" rx="8" fill="#fff" stroke="#1d4ed8" stroke-width="2"/><text x="374" y="400" font-size="13" font-weight="800" fill="#1d4ed8" text-anchor="middle">DMA</text><text x="374" y="418" font-size="10.5" font-weight="400" fill="#1d4ed8" text-anchor="middle">pega o próximo valor</text><path d="M476 403 H500" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ar)"/><rect x="504" y="378" width="200" height="50" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="604" y="400" font-size="13" font-weight="800" fill="#7c3aed" text-anchor="middle">tabela</text><text x="604" y="418" font-size="10.5" font-weight="400" fill="#7c3aed" text-anchor="middle">100 pontos de um seno</text><path d="M706 403 H730" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#ar)"/><rect x="734" y="378" width="200" height="50" rx="8" fill="#fff" stroke="#16a34a" stroke-width="2"/><text x="834" y="400" font-size="13" font-weight="800" fill="#16a34a" text-anchor="middle">DAC</text><text x="834" y="418" font-size="10.5" font-weight="400" fill="#16a34a" text-anchor="middle">atualiza a saída</text><path d="M70.0 530.0 H86.2 V507.0 H102.5 V487.6 H118.8 V474.6 H135.0 V470.0 H151.2 V474.6 H167.5 V487.6 H183.8 V507.0 H200.0 V530.0 H216.2 V553.0 H232.5 V572.4 H248.8 V585.4 H265.0 V590.0 H281.2 V585.4 H297.5 V572.4 H313.8 V553.0 H330.0 V530.0 H346.2 V507.0 H362.5 V487.6 H378.8 V474.6 H395.0 V470.0 H411.2 V474.6 H427.5 V487.6 H443.8 V507.0 H460.0 V530.0 H476.2 V553.0 H492.5 V572.4 H508.8 V585.4 H525.0 V590.0 H541.2 V585.4 H557.5 V572.4 H573.8 V553.0 H590.0" fill="none" stroke="#16a34a" stroke-width="2.2"/><polyline points="70.0,541.7 74.0,536.0 78.0,530.2 82.0,524.4 86.0,518.7 90.0,513.0 94.0,507.5 98.0,502.3 102.0,497.3 106.0,492.6 110.0,488.2 114.0,484.3 118.0,480.7 122.0,477.7 126.0,475.1 130.0,473.0 134.0,471.5 138.0,470.5 142.0,470.0 146.0,470.1 150.0,470.8 154.0,472.1 158.0,473.8 162.0,476.1 166.0,478.9 170.0,482.2 174.0,485.9 178.0,490.1 182.0,494.6 186.0,499.4 190.0,504.6 194.0,509.9 198.0,515.5 202.0,521.2 206.0,526.9 210.0,532.7 214.0,538.5 218.0,544.2 222.0,549.7 226.0,555.1 230.0,560.3 234.0,565.1 238.0,569.7 242.0,573.8 246.0,577.6 250.0,580.9 254.0,583.7 258.0,586.0 262.0,587.8 266.0,589.1 270.0,589.8 274.0,590.0 278.0,589.6 282.0,588.6 286.0,587.1 290.0,585.1 294.0,582.5 298.0,579.5 302.0,576.0 306.0,572.0 310.0,567.7 314.0,563.0 318.0,558.0 322.0,552.8 326.0,547.3 330.0,541.7 334.0,536.0 338.0,530.2 342.0,524.4 346.0,518.7 350.0,513.0 354.0,507.5 358.0,502.3 362.0,497.3 366.0,492.6 370.0,488.2 374.0,484.3 378.0,480.7 382.0,477.7 386.0,475.1 390.0,473.0 394.0,471.5 398.0,470.5 402.0,470.0 406.0,470.1 410.0,470.8 414.0,472.1 418.0,473.8 422.0,476.1 426.0,478.9 430.0,482.2 434.0,485.9 438.0,490.1 442.0,494.6 446.0,499.4 450.0,504.6 454.0,509.9 458.0,515.5 462.0,521.2 466.0,526.9 470.0,532.7 474.0,538.5 478.0,544.2 482.0,549.7 486.0,555.1 490.0,560.3 494.0,565.1 498.0,569.7 502.0,573.8 506.0,577.6 510.0,580.9 514.0,583.7 518.0,586.0 522.0,587.8 526.0,589.1 530.0,589.8 534.0,590.0 538.0,589.6 542.0,588.6 546.0,587.1 550.0,585.1 554.0,582.5 558.0,579.5 562.0,576.0 566.0,572.0 570.0,567.7 574.0,563.0 578.0,558.0 582.0,552.8 586.0,547.3" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="6 4"/><text x="610" y="490" font-size="11.5" font-weight="700" fill="#16a34a" text-anchor="start">verde: degraus que saem do DAC</text><text x="610" y="510" font-size="11.5" font-weight="700" fill="#7c3aed" text-anchor="start">roxo tracejado: depois de um filtro RC</text><text x="610" y="540" font-size="11.5" font-weight="800" fill="#1e293b" text-anchor="start">frequência = taxa de disparo ÷ pontos</text><text x="610" y="558" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start">1 MHz ÷ 100 pontos = 10 kHz</text><text x="330" y="614" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">desenho com 16 pontos por período, para os degraus ficarem visíveis</text><text x="610" y="582" font-size="11" font-weight="400" fill="#475569" text-anchor="start">o DAC também gera triângulo e ruído</text><text x="610" y="598" font-size="11" font-weight="400" fill="#475569" text-anchor="start">por hardware, sem tabela</text><text x="24" y="670" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">3 · DAC OU PWM FILTRADO?</text>
<rect x="24" y="686" width="952" height="160" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="44" y="714" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start"></text><text x="194" y="714" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">DAC do H743</text><text x="574" y="714" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">PWM + filtro RC</text><text x="44" y="740" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">resolução</text><text x="194" y="740" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">12 bits (ou 8)</text><text x="574" y="740" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">depende da frequência do PWM</text><text x="44" y="766" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">velocidade</text><text x="194" y="766" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">até ~1 MHz de atualização (estabiliza em ~2 µs)</text><text x="574" y="766" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">lenta: o filtro precisa cortar o PWM</text><text x="44" y="792" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">ondulação</text><text x="194" y="792" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">só os degraus</text><text x="574" y="792" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">sobra ondulação do PWM</text><text x="44" y="818" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">pinos</text><text x="194" y="818" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">só PA4 e PA5</text><text x="574" y="818" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">quase qualquer canal de timer</text>
<g transform="translate(24 862)"><rect width="952" height="80" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/><text x="18" y="27" font-size="14" font-weight="800" fill="#14532d" text-anchor="start">Na WeAct H743</text><text x="18" y="50" font-size="13" font-weight="400" fill="#1e293b" text-anchor="start">DAC1_OUT2 em PA5, livre; DAC1_OUT1 em PA4, que é o HSYNC da câmera. O DAC não alimenta LED, motor nem alto-falante:</text><text x="18" y="70" font-size="13" font-weight="400" fill="#1e293b" text-anchor="start">use um amplificador operacional ou transistor. VREF+ da placa = 3V3 (R9), então o ruído do 3V3 aparece na saída.</text></g>
</svg>
