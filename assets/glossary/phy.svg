<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">PHY: camada física das interfaces</title>
  <desc id="d">Tabela de controladores do H743 e suas camadas físicas (PHY Ethernet, PHY USB interna e ULPI, transceptores CAN, RS-485 e RS-232), caminho de transmissão de um PHY 100BASE-TX com codificação MLT-3 e registradores MDIO para diagnóstico.</desc>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
  <rect width="1000" height="900" fill="#ffffff"/>
<text x="24" y="34" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">1 · CONTROLADOR NO CHIP × CAMADA FÍSICA × MEIO</text>
<rect x="24" y="50" width="952" height="290" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="44" y="80" font-size="12" font-weight="800" fill="#16a34a" text-anchor="start">Controlador (bits e quadros)</text><text x="370" y="80" font-size="12" font-weight="800" fill="#b45309" text-anchor="start">PHY / transceptor (tensão, clock, isolação)</text><text x="760" y="80" font-size="12" font-weight="800" fill="#475569" text-anchor="start">Meio</text><rect x="44" y="96" width="260" height="30" rx="6" fill="#0f3b2e"/><text x="58" y="116" font-size="12" font-weight="800" fill="#fff" text-anchor="start">Ethernet · MAC</text><path d="M306 111 H364" fill="none" stroke="#94a3b8" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/><rect x="366" y="96" width="330" height="30" rx="6" fill="#fef3c7" stroke="#b45309"/><text x="380" y="116" font-size="12" font-weight="800" fill="#b45309" text-anchor="start">PHY LAN8720 + transformador</text><text x="690" y="116" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="end">externo</text><path d="M698 111 H756" fill="none" stroke="#94a3b8" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/><rect x="758" y="96" width="198" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="770" y="116" font-size="12" font-weight="700" fill="#334155" text-anchor="start">par trançado, RJ45</text><rect x="44" y="134" width="260" height="30" rx="6" fill="#0f3b2e"/><text x="58" y="154" font-size="12" font-weight="800" fill="#fff" text-anchor="start">USB · OTG_FS</text><path d="M306 149 H364" fill="none" stroke="#94a3b8" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/><rect x="366" y="134" width="330" height="30" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="380" y="154" font-size="12" font-weight="800" fill="#16a34a" text-anchor="start">PHY full-speed dentro do H743</text><text x="690" y="154" font-size="10.5" font-weight="700" fill="#16a34a" text-anchor="end">interno ✓</text><path d="M698 149 H756" fill="none" stroke="#94a3b8" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/><rect x="758" y="134" width="198" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="770" y="154" font-size="12" font-weight="700" fill="#334155" text-anchor="start">D+ / D−, USB-C</text><rect x="44" y="172" width="260" height="30" rx="6" fill="#0f3b2e"/><text x="58" y="192" font-size="12" font-weight="800" fill="#fff" text-anchor="start">USB HS · OTG_HS</text><path d="M306 187 H364" fill="none" stroke="#94a3b8" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/><rect x="366" y="172" width="330" height="30" rx="6" fill="#fef3c7" stroke="#b45309"/><text x="380" y="192" font-size="12" font-weight="800" fill="#b45309" text-anchor="start">PHY ULPI (ex.: USB3300)</text><text x="690" y="192" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="end">externo</text><path d="M698 187 H756" fill="none" stroke="#94a3b8" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/><rect x="758" y="172" width="198" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="770" y="192" font-size="12" font-weight="700" fill="#334155" text-anchor="start">D+ / D−, 480 Mbit/s</text><rect x="44" y="210" width="260" height="30" rx="6" fill="#0f3b2e"/><text x="58" y="230" font-size="12" font-weight="800" fill="#fff" text-anchor="start">CAN · FDCAN</text><path d="M306 225 H364" fill="none" stroke="#94a3b8" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/><rect x="366" y="210" width="330" height="30" rx="6" fill="#fef3c7" stroke="#b45309"/><text x="380" y="230" font-size="12" font-weight="800" fill="#b45309" text-anchor="start">transceptor SN65HVD230</text><text x="690" y="230" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="end">externo</text><path d="M698 225 H756" fill="none" stroke="#94a3b8" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/><rect x="758" y="210" width="198" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="770" y="230" font-size="12" font-weight="700" fill="#334155" text-anchor="start">CANH / CANL</text><rect x="44" y="248" width="260" height="30" rx="6" fill="#0f3b2e"/><text x="58" y="268" font-size="12" font-weight="800" fill="#fff" text-anchor="start">RS-485 · USART + DE</text><path d="M306 263 H364" fill="none" stroke="#94a3b8" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/><rect x="366" y="248" width="330" height="30" rx="6" fill="#fef3c7" stroke="#b45309"/><text x="380" y="268" font-size="12" font-weight="800" fill="#b45309" text-anchor="start">transceptor MAX485</text><text x="690" y="268" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="end">externo</text><path d="M698 263 H756" fill="none" stroke="#94a3b8" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/><rect x="758" y="248" width="198" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="770" y="268" font-size="12" font-weight="700" fill="#334155" text-anchor="start">A / B, até ~1 km</text><rect x="44" y="286" width="260" height="30" rx="6" fill="#0f3b2e"/><text x="58" y="306" font-size="12" font-weight="800" fill="#fff" text-anchor="start">RS-232 · USART</text><path d="M306 301 H364" fill="none" stroke="#94a3b8" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/><rect x="366" y="286" width="330" height="30" rx="6" fill="#fef3c7" stroke="#b45309"/><text x="380" y="306" font-size="12" font-weight="800" fill="#b45309" text-anchor="start">conversor MAX3232</text><text x="690" y="306" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="end">externo</text><path d="M698 301 H756" fill="none" stroke="#94a3b8" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/><rect x="758" y="286" width="198" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="770" y="306" font-size="12" font-weight="700" fill="#334155" text-anchor="start">±5 a ±12 V, DB9</text><text x="500" y="362" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">Ter o periférico no chip não basta: a interface só funciona com a camada física certa e os componentes do meio.</text><text x="24" y="404" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">2 · DENTRO DE UM PHY ETHERNET 100BASE-TX</text>
<rect x="24" y="420" width="952" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="44" y="448" font-size="12.5" font-weight="800" fill="#1e293b" text-anchor="start">Caminho de transmissão</text><rect x="44" y="460" width="130" height="34" rx="6" fill="#fff" stroke="#1d4ed8" stroke-width="2"/><text x="109" y="482" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">4 bits do MAC</text><path d="M176 477 H190" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ar)"/><rect x="192" y="460" width="130" height="34" rx="6" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="257" y="482" font-size="12" font-weight="800" fill="#0f766e" text-anchor="middle">4B5B</text><path d="M324 477 H338" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#ar)"/><rect x="340" y="460" width="130" height="34" rx="6" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="405" y="482" font-size="12" font-weight="800" fill="#7c3aed" text-anchor="middle">embaralhador</text><path d="M472 477 H486" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#ar)"/><rect x="488" y="460" width="130" height="34" rx="6" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="553" y="482" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">MLT-3</text><path d="M620 477 H634" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#ar)"/><rect x="636" y="460" width="130" height="34" rx="6" fill="#fff" stroke="#475569" stroke-width="2"/><text x="701" y="482" font-size="12" font-weight="800" fill="#475569" text-anchor="middle">par TX±</text><text x="44" y="518" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">4B5B garante transições para recuperar o clock; o embaralhador espalha o espectro;</text><text x="44" y="534" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">o MLT-3 usa três níveis e só muda de nível nos bits 1, reduzindo a frequência no cabo (125 Mbaud → ~31 MHz).</text><path d="M70 600 H110 V574 H170 V574 H230 V600 H290 V626 H350 V626 H410 V600 H470 V574 H530 V600 H590" fill="none" stroke="#b45309" stroke-width="2.6"/><text x="44" y="578" font-size="11" font-weight="400" fill="#475569" text-anchor="start">+1</text><text x="44" y="604" font-size="11" font-weight="400" fill="#475569" text-anchor="start">0</text><text x="44" y="630" font-size="11" font-weight="400" fill="#475569" text-anchor="start">−1</text><text x="140.0" y="652" font-size="13" font-weight="800" fill="#1e293b" text-anchor="middle">1</text><line x1="110" y1="566" x2="110" y2="640" stroke="#e2e8f0"/><text x="200.0" y="652" font-size="13" font-weight="800" fill="#1e293b" text-anchor="middle">0</text><line x1="170" y1="566" x2="170" y2="640" stroke="#e2e8f0"/><text x="260.0" y="652" font-size="13" font-weight="800" fill="#1e293b" text-anchor="middle">1</text><line x1="230" y1="566" x2="230" y2="640" stroke="#e2e8f0"/><text x="320.0" y="652" font-size="13" font-weight="800" fill="#1e293b" text-anchor="middle">1</text><line x1="290" y1="566" x2="290" y2="640" stroke="#e2e8f0"/><text x="380.0" y="652" font-size="13" font-weight="800" fill="#1e293b" text-anchor="middle">0</text><line x1="350" y1="566" x2="350" y2="640" stroke="#e2e8f0"/><text x="440.0" y="652" font-size="13" font-weight="800" fill="#1e293b" text-anchor="middle">1</text><line x1="410" y1="566" x2="410" y2="640" stroke="#e2e8f0"/><text x="500.0" y="652" font-size="13" font-weight="800" fill="#1e293b" text-anchor="middle">1</text><line x1="470" y1="566" x2="470" y2="640" stroke="#e2e8f0"/><text x="560.0" y="652" font-size="13" font-weight="800" fill="#1e293b" text-anchor="middle">1</text><line x1="530" y1="566" x2="530" y2="640" stroke="#e2e8f0"/><text x="610" y="596" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="start">bit 1: avança um nível</text><text x="610" y="614" font-size="11.5" font-weight="400" fill="#b45309" text-anchor="start">(0 → +1 → 0 → −1 → 0)</text><text x="610" y="636" font-size="11.5" font-weight="700" fill="#475569" text-anchor="start">bit 0: fica parado</text><text x="24" y="712" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">3 · FALAR COM O PHY PELO MDIO</text>
<rect x="24" y="728" width="466" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="44" y="756" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">Registrador</text><text x="194" y="756" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">O que diz</text><text x="44" y="780" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">0 · BMCR</text><text x="194" y="780" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">reset, velocidade, autonegociação</text><text x="44" y="804" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">1 · BMSR</text><text x="194" y="804" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">link ok, negociação concluída</text><text x="44" y="828" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">2 e 3 · PHYID</text><text x="194" y="828" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">fabricante e modelo</text><text x="44" y="852" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">endereço 0–31</text><text x="194" y="852" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">definido por pinos (straps)</text>
<rect x="510" y="728" width="466" height="150" rx="10" fill="#fffbeb" stroke="#f1d58a"/>
<text x="530" y="756" font-size="12.5" font-weight="800" fill="#1e293b" text-anchor="start">Diagnóstico rápido</text><text x="530" y="782" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">• PHYID = 0xFFFF: MDIO mudo (endereço, pull-up, fio)</text><text x="530" y="804" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">• sem link: cabo, reset do PHY ou transformador</text><text x="530" y="826" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">• link ok, sem dados: clock de 50 MHz (RMII) ou pinos</text><text x="530" y="848" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">• LEDs trocados: configuração dos straps</text></svg>
