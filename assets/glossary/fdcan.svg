<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 980" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">FDCAN: rede CAN, arbitragem e quadro CAN FD</title>
  <desc id="d">Rede CAN com a WeAct H743 (FDCAN1 em PD0/PD1), transceptor SN65HVD230 e terminação de 120 Ohm, níveis recessivo e dominante, arbitragem por ID e comparação entre quadros CAN 2.0 e CAN FD.</desc>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
  <rect width="1000" height="980" fill="#ffffff"/>
<text x="24" y="34" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">1 · A REDE: TRANSCEPTOR EM CADA NÓ, PAR TRANÇADO E 120 Ω NAS PONTAS</text>
<rect x="24" y="50" width="952" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="44" y="70" width="120" height="90" rx="8" fill="#0f3b2e"/><text x="104.0" y="111.0" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">H743</text><text x="104.0" y="131.0" font-size="11" font-weight="400" fill="#bbf7d0" text-anchor="middle">FDCAN1</text>
<rect x="230" y="70" width="130" height="90" rx="8" fill="#475569"/><text x="295.0" y="103.0" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">transceptor</text><text x="295.0" y="123.0" font-size="11" font-weight="400" fill="#e2e8f0" text-anchor="middle">SN65HVD230</text><text x="295.0" y="139.0" font-size="11" font-weight="400" fill="#e2e8f0" text-anchor="middle">3,3 V</text>
<path d="M164 104 H228" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ar)"/><text x="196" y="96" font-size="10.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">TX</text><path d="M228 140 H166" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#ar)"/><text x="196" y="132" font-size="10.5" font-weight="800" fill="#7c3aed" text-anchor="middle">RX</text><text x="104" y="176" font-size="11" font-weight="700" fill="#16a34a" text-anchor="middle">PD1 TX · PD0 RX</text><path d="M80 222 H920" stroke="#b45309" stroke-width="3.5"/><path d="M80 256 H920" stroke="#1d4ed8" stroke-width="3.5"/><text x="930" y="227" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="start">CANH</text><text x="930" y="261" font-size="11.5" font-weight="800" fill="#1d4ed8" text-anchor="start">CANL</text><rect x="71" y="226" width="18" height="26" rx="2" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="80" y="278" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="middle">120 Ω</text><rect x="891" y="226" width="18" height="26" rx="2" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="900" y="278" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="middle">120 Ω</text><path d="M275 160 V222 M315 160 V256" stroke="#94a3b8" stroke-width="2"/><rect x="430" y="80" width="120" height="70" rx="8" fill="#334155"/><text x="490.0" y="111.0" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">sensor</text><text x="490.0" y="131.0" font-size="11" font-weight="400" fill="#cbd5e1" text-anchor="middle">ID 0x120</text>
<path d="M475 150 V222 M505 150 V256" stroke="#94a3b8" stroke-width="2"/><circle cx="475" cy="222" r="4" fill="#b45309"/><circle cx="505" cy="256" r="4" fill="#1d4ed8"/><rect x="620" y="80" width="120" height="70" rx="8" fill="#334155"/><text x="680.0" y="111.0" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">motor</text><text x="680.0" y="131.0" font-size="11" font-weight="400" fill="#cbd5e1" text-anchor="middle">ID 0x080</text>
<path d="M665 150 V222 M695 150 V256" stroke="#94a3b8" stroke-width="2"/><circle cx="665" cy="222" r="4" fill="#b45309"/><circle cx="695" cy="256" r="4" fill="#1d4ed8"/><rect x="790" y="80" width="120" height="70" rx="8" fill="#334155"/><text x="850.0" y="111.0" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">painel</text><text x="850.0" y="131.0" font-size="11" font-weight="400" fill="#cbd5e1" text-anchor="middle">ID 0x300</text>
<path d="M835 150 V222 M865 150 V256" stroke="#94a3b8" stroke-width="2"/><circle cx="835" cy="222" r="4" fill="#b45309"/><circle cx="865" cy="256" r="4" fill="#1d4ed8"/><text x="560" y="180" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">cada nó também tem MCU + transceptor</text><text x="500" y="322" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">Não há mestre: qualquer nó transmite quando o barramento está livre, e a mensagem é identificada pelo ID, não por endereço de destino.</text><text x="24" y="364" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">2 · NÍVEIS ELÉTRICOS E ARBITRAGEM</text>
<rect x="24" y="380" width="466" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="44" y="406" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">Tensão no par (valores típicos de um transceptor)</text><path d="M70 470 H150 V440 H230 V470 H310 V440 H390 V470 H460" fill="none" stroke="#b45309" stroke-width="2.5"/><path d="M70 470 H150 V500 H230 V470 H310 V500 H390 V470 H460" fill="none" stroke="#1d4ed8" stroke-width="2.5"/><text x="44" y="444" font-size="11" font-weight="400" fill="#475569" text-anchor="start">3,5</text><text x="44" y="474" font-size="11" font-weight="400" fill="#475569" text-anchor="start">2,5</text><text x="44" y="504" font-size="11" font-weight="400" fill="#475569" text-anchor="start">1,5</text><text x="110" y="528" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">recessivo</text><text x="190" y="528" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">dominante</text><text x="270" y="528" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">recessivo</text><text x="350" y="528" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">dominante</text><text x="110" y="546" font-size="13" font-weight="800" fill="#1e293b" text-anchor="middle">1</text><text x="190" y="546" font-size="13" font-weight="800" fill="#1e293b" text-anchor="middle">0</text><text x="270" y="546" font-size="13" font-weight="800" fill="#1e293b" text-anchor="middle">1</text><text x="350" y="546" font-size="13" font-weight="800" fill="#1e293b" text-anchor="middle">0</text><text x="44" y="566" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start">Recessivo: CANH = CANL (diferença 0) = bit 1.</text><text x="44" y="582" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start">Dominante: diferença ≈ 2 V = bit 0.</text><text x="44" y="600" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="start">Um único nó enviando 0 vence todos os que enviam 1.</text><rect x="510" y="380" width="466" height="230" rx="10" fill="#fffbeb" stroke="#f1d58a"/>
<text x="530" y="406" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">Dois nós começam juntos: vence o menor ID</text><text x="530" y="444" font-size="11.5" font-weight="700" fill="#1e293b" text-anchor="start">motor 0x080</text><path d="M632 440 l4 -10 h20 l4 10 l-4 10 h-20z" stroke="#1d4ed8" fill="#dbeafe" stroke-width="1.6"/><text x="646.0" y="444" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">0</text><path d="M660 440 l4 -10 h20 l4 10 l-4 10 h-20z" stroke="#1d4ed8" fill="#dbeafe" stroke-width="1.6"/><text x="674.0" y="444" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">0</text><path d="M688 440 l4 -10 h20 l4 10 l-4 10 h-20z" stroke="#1d4ed8" fill="#dbeafe" stroke-width="1.6"/><text x="702.0" y="444" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">0</text><path d="M716 440 l4 -10 h20 l4 10 l-4 10 h-20z" stroke="#b45309" fill="#fef3c7" stroke-width="1.6"/><text x="730.0" y="444" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">1</text><path d="M744 440 l4 -10 h20 l4 10 l-4 10 h-20z" stroke="#1d4ed8" fill="#dbeafe" stroke-width="1.6"/><text x="758.0" y="444" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">0</text><path d="M772 440 l4 -10 h20 l4 10 l-4 10 h-20z" stroke="#1d4ed8" fill="#dbeafe" stroke-width="1.6"/><text x="786.0" y="444" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">0</text><path d="M800 440 l4 -10 h20 l4 10 l-4 10 h-20z" stroke="#1d4ed8" fill="#dbeafe" stroke-width="1.6"/><text x="814.0" y="444" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">0</text><path d="M828 440 l4 -10 h20 l4 10 l-4 10 h-20z" stroke="#1d4ed8" fill="#dbeafe" stroke-width="1.6"/><text x="842.0" y="444" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">0</text><path d="M856 440 l4 -10 h20 l4 10 l-4 10 h-20z" stroke="#1d4ed8" fill="#dbeafe" stroke-width="1.6"/><text x="870.0" y="444" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">0</text><path d="M884 440 l4 -10 h20 l4 10 l-4 10 h-20z" stroke="#1d4ed8" fill="#dbeafe" stroke-width="1.6"/><text x="898.0" y="444" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">0</text><path d="M912 440 l4 -10 h20 l4 10 l-4 10 h-20z" stroke="#1d4ed8" fill="#dbeafe" stroke-width="1.6"/><text x="926.0" y="444" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">0</text><text x="530" y="488" font-size="11.5" font-weight="700" fill="#1e293b" text-anchor="start">sensor 0x120</text><path d="M632 484 l4 -10 h20 l4 10 l-4 10 h-20z" stroke="#1d4ed8" fill="#dbeafe" stroke-width="1.6"/><text x="646.0" y="488" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">0</text><path d="M660 484 l4 -10 h20 l4 10 l-4 10 h-20z" stroke="#1d4ed8" fill="#dbeafe" stroke-width="1.6"/><text x="674.0" y="488" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">0</text><path d="M688 484 l4 -10 h20 l4 10 l-4 10 h-20z" stroke="#475569" fill="#f1f5f9" stroke-width="1.6"/><text x="702.0" y="488" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">1</text><path d="M716 484 l4 -10 h20 l4 10 l-4 10 h-20z" stroke="#475569" fill="#f1f5f9" stroke-width="1.6"/><text x="730.0" y="488" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">0</text><path d="M744 484 l4 -10 h20 l4 10 l-4 10 h-20z" stroke="#475569" fill="#f1f5f9" stroke-width="1.6"/><text x="758.0" y="488" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">0</text><path d="M772 484 l4 -10 h20 l4 10 l-4 10 h-20z" stroke="#475569" fill="#f1f5f9" stroke-width="1.6"/><text x="786.0" y="488" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">1</text><path d="M800 484 l4 -10 h20 l4 10 l-4 10 h-20z" stroke="#475569" fill="#f1f5f9" stroke-width="1.6"/><text x="814.0" y="488" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">0</text><path d="M828 484 l4 -10 h20 l4 10 l-4 10 h-20z" stroke="#475569" fill="#f1f5f9" stroke-width="1.6"/><text x="842.0" y="488" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">0</text><path d="M856 484 l4 -10 h20 l4 10 l-4 10 h-20z" stroke="#475569" fill="#f1f5f9" stroke-width="1.6"/><text x="870.0" y="488" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">0</text><path d="M884 484 l4 -10 h20 l4 10 l-4 10 h-20z" stroke="#475569" fill="#f1f5f9" stroke-width="1.6"/><text x="898.0" y="488" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">0</text><path d="M912 484 l4 -10 h20 l4 10 l-4 10 h-20z" stroke="#475569" fill="#f1f5f9" stroke-width="1.6"/><text x="926.0" y="488" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">0</text><path d="M688 420 V512" stroke="#b91c1c" stroke-width="2" stroke-dasharray="4 3"/><text x="694" y="530" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="start">bit 3: o sensor manda 1, lê 0 no barramento,</text><text x="694" y="546" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="start">para de transmitir e tenta de novo depois</text><text x="530" y="586" font-size="11.5" font-weight="700" fill="#16a34a" text-anchor="start">Sem colisão destrutiva: a mensagem do motor segue intacta.</text><text x="24" y="652" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">3 · QUADRO CAN CLÁSSICO × CAN FD</text>
<text x="44" y="680" font-size="12.5" font-weight="800" fill="#1e293b" text-anchor="start">CAN 2.0: tudo a até 1 Mbit/s, no máximo 8 bytes</text><rect x="44" y="690" width="38" height="34" rx="4" fill="#f1f5f9" stroke="#475569"/><text x="63.0" y="712" font-size="11" font-weight="800" fill="#475569" text-anchor="middle">SOF</text><rect x="84" y="690" width="128" height="34" rx="4" fill="#fef3c7" stroke="#b45309"/><text x="148.0" y="712" font-size="11" font-weight="800" fill="#b45309" text-anchor="middle">ID 11 bits</text><rect x="214" y="690" width="88" height="34" rx="4" fill="#f1f5f9" stroke="#475569"/><text x="258.0" y="712" font-size="11" font-weight="800" fill="#475569" text-anchor="middle">controle</text><rect x="304" y="690" width="328" height="34" rx="4" fill="#dbeafe" stroke="#1d4ed8"/><text x="468.0" y="712" font-size="11" font-weight="800" fill="#1d4ed8" text-anchor="middle">dados 0–8 bytes</text><rect x="634" y="690" width="108" height="34" rx="4" fill="#f1f5f9" stroke="#475569"/><text x="688.0" y="712" font-size="11" font-weight="800" fill="#475569" text-anchor="middle">CRC</text><rect x="744" y="690" width="58" height="34" rx="4" fill="#dcfce7" stroke="#16a34a"/><text x="773.0" y="712" font-size="11" font-weight="800" fill="#16a34a" text-anchor="middle">ACK</text><rect x="804" y="690" width="68" height="34" rx="4" fill="#f1f5f9" stroke="#475569"/><text x="838.0" y="712" font-size="11" font-weight="800" fill="#475569" text-anchor="middle">fim</text><text x="44" y="754" font-size="12.5" font-weight="800" fill="#1e293b" text-anchor="start">CAN FD: arbitragem na taxa nominal; depois do BRS, dados até 64 bytes a 2–8 Mbit/s</text><rect x="44" y="764" width="38" height="34" rx="4" fill="#f1f5f9" stroke="#475569"/><text x="63.0" y="786" font-size="11" font-weight="800" fill="#475569" text-anchor="middle">SOF</text><rect x="84" y="764" width="128" height="34" rx="4" fill="#fef3c7" stroke="#b45309"/><text x="148.0" y="786" font-size="11" font-weight="800" fill="#b45309" text-anchor="middle">ID 11 bits</text><rect x="214" y="764" width="88" height="34" rx="4" fill="#f1f5f9" stroke="#475569"/><text x="258.0" y="786" font-size="11" font-weight="800" fill="#475569" text-anchor="middle">ctrl · BRS</text><rect x="304" y="764" width="398" height="34" rx="4" fill="#ede9fe" stroke="#7c3aed"/><text x="503.0" y="786" font-size="11" font-weight="800" fill="#7c3aed" text-anchor="middle">dados 0–64 bytes, clock mais rápido</text><rect x="704" y="764" width="58" height="34" rx="4" fill="#f1f5f9" stroke="#475569"/><text x="733.0" y="786" font-size="11" font-weight="800" fill="#475569" text-anchor="middle">CRC</text><rect x="764" y="764" width="58" height="34" rx="4" fill="#dcfce7" stroke="#16a34a"/><text x="793.0" y="786" font-size="11" font-weight="800" fill="#16a34a" text-anchor="middle">ACK</text><rect x="824" y="764" width="68" height="34" rx="4" fill="#f1f5f9" stroke="#475569"/><text x="858.0" y="786" font-size="11" font-weight="800" fill="#475569" text-anchor="middle">fim</text><path d="M264 808 V820 H662 V808" fill="none" stroke="#7c3aed" stroke-width="1.6"/><text x="463" y="836" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">fase de dados: taxa maior (BRS = bit rate switch)</text><text x="820" y="836" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">limite: transceptor e cabo</text><g transform="translate(24 858)"><rect width="952" height="86" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/><text x="18" y="27" font-size="14" font-weight="800" fill="#14532d" text-anchor="start">Na WeAct H743</text><text x="18" y="50" font-size="13" font-weight="400" fill="#1e293b" text-anchor="start">FDCAN1 em PD0 (RX) / PD1 (TX) e FDCAN2 em PB12 (RX) / PB13 (TX), livres nos headers. A placa não tem transceptor: use um de 3,3 V</text><text x="18" y="70" font-size="13" font-weight="400" fill="#1e293b" text-anchor="start">(SN65HVD230, TJA1051T/3). Os dois FDCAN dividem 10 KiB de RAM de mensagens; o FDCAN1 também faz TT-CAN (ISO 11898-4).</text></g>
</svg>
