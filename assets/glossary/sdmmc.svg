<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 960" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">SDMMC: microSD em 4 bits, leitura de bloco e velocidades</title>
  <desc id="d">Ligação do microSD da WeAct H743 ao SDMMC1 (PC8 a PC12, PD2, detecção em PD4) com resistores de 22 Ohm e pull-ups de 47 kOhm, leitura de um bloco de 512 bytes com o comando CMD17, etapas de inicialização, velocidades e tipos de cartão.</desc>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
  <rect width="1000" height="960" fill="#ffffff"/>
<text x="24" y="34" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">1 · O MICROSD DA WEACT H743 (SDMMC1, 4 BITS)</text>
<rect x="24" y="50" width="952" height="290" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="44" y="80" width="150" height="230" rx="8" fill="#0f3b2e"/><text x="119.0" y="183.0" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">H743</text><text x="119.0" y="203.0" font-size="11" font-weight="400" fill="#bbf7d0" text-anchor="middle">SDMMC1</text><text x="119.0" y="219.0" font-size="11" font-weight="400" fill="#bbf7d0" text-anchor="middle">DMA interno</text>
<rect x="780" y="80" width="176" height="230" rx="8" fill="#64748b"/><text x="868.0" y="183.0" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">microSD</text><text x="868.0" y="203.0" font-size="11" font-weight="400" fill="#f1f5f9" text-anchor="middle">soquete da placa</text><text x="868.0" y="219.0" font-size="11" font-weight="400" fill="#f1f5f9" text-anchor="middle">SD, SDHC, SDXC</text>
<path d="M194 100 H778" fill="none" stroke="#b45309" stroke-width="2.6" marker-end="url(#ar)"/><text x="210" y="94" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="start">CLK · PC12</text><text x="330" y="94" font-size="11" font-weight="400" fill="#b45309" text-anchor="start">clock, só do H743</text><rect x="560" y="95" width="30" height="10" rx="2" fill="#fff" stroke="#475569" stroke-width="1.6"/><path d="M194 134 H778" fill="none" stroke="#0f766e" stroke-width="2.6" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="210" y="128" font-size="11.5" font-weight="800" fill="#0f766e" text-anchor="start">CMD · PD2</text><text x="330" y="128" font-size="11" font-weight="400" fill="#0f766e" text-anchor="start">comandos e respostas</text><rect x="560" y="129" width="30" height="10" rx="2" fill="#fff" stroke="#475569" stroke-width="1.6"/><path d="M660 134 V126" stroke="#b91c1c" stroke-width="1.6"/><rect x="655" y="116" width="10" height="10" rx="1" fill="#fff" stroke="#b91c1c" stroke-width="1.4"/><circle cx="660" cy="134" r="3" fill="#b91c1c"/><path d="M194 170 H778" fill="none" stroke="#1d4ed8" stroke-width="2.6" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="210" y="164" font-size="11.5" font-weight="800" fill="#1d4ed8" text-anchor="start">D0 · PC8</text><text x="330" y="164" font-size="11" font-weight="400" fill="#1d4ed8" text-anchor="start">dados em paralelo: 4 bits por clock</text><rect x="560" y="165" width="30" height="10" rx="2" fill="#fff" stroke="#475569" stroke-width="1.6"/><path d="M660 170 V162" stroke="#b91c1c" stroke-width="1.6"/><rect x="655" y="152" width="10" height="10" rx="1" fill="#fff" stroke="#b91c1c" stroke-width="1.4"/><circle cx="660" cy="170" r="3" fill="#b91c1c"/><path d="M194 196 H778" fill="none" stroke="#1d4ed8" stroke-width="2.6" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="210" y="190" font-size="11.5" font-weight="800" fill="#1d4ed8" text-anchor="start">D1 · PC9</text><rect x="560" y="191" width="30" height="10" rx="2" fill="#fff" stroke="#475569" stroke-width="1.6"/><path d="M660 196 V188" stroke="#b91c1c" stroke-width="1.6"/><rect x="655" y="178" width="10" height="10" rx="1" fill="#fff" stroke="#b91c1c" stroke-width="1.4"/><circle cx="660" cy="196" r="3" fill="#b91c1c"/><path d="M194 222 H778" fill="none" stroke="#1d4ed8" stroke-width="2.6" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="210" y="216" font-size="11.5" font-weight="800" fill="#1d4ed8" text-anchor="start">D2 · PC10</text><rect x="560" y="217" width="30" height="10" rx="2" fill="#fff" stroke="#475569" stroke-width="1.6"/><path d="M660 222 V214" stroke="#b91c1c" stroke-width="1.6"/><rect x="655" y="204" width="10" height="10" rx="1" fill="#fff" stroke="#b91c1c" stroke-width="1.4"/><circle cx="660" cy="222" r="3" fill="#b91c1c"/><path d="M194 248 H778" fill="none" stroke="#1d4ed8" stroke-width="2.6" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="210" y="242" font-size="11.5" font-weight="800" fill="#1d4ed8" text-anchor="start">D3 · PC11</text><rect x="560" y="243" width="30" height="10" rx="2" fill="#fff" stroke="#475569" stroke-width="1.6"/><path d="M660 248 V240" stroke="#b91c1c" stroke-width="1.6"/><rect x="655" y="230" width="10" height="10" rx="1" fill="#fff" stroke="#b91c1c" stroke-width="1.4"/><circle cx="660" cy="248" r="3" fill="#b91c1c"/><text x="575" y="76" font-size="11" font-weight="800" fill="#475569" text-anchor="middle">22 Ω</text><text x="700" y="76" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="middle">47 kΩ → 3V3</text><path d="M778 290 H196" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="5 4"/><text x="210" y="284" font-size="11.5" font-weight="800" fill="#7c3aed" text-anchor="start">detecção do cartão → PD4 (via SB2)</text><text x="500" y="362" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">Os 22 Ω amortecem reflexões nas bordas rápidas; os 47 kΩ mantêm as linhas em 1 enquanto ninguém as aciona.</text><text x="24" y="404" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">2 · LER UM BLOCO DE 512 BYTES (CMD17)</text>
<text x="44" y="446" font-size="13" font-weight="800" fill="#0f766e" text-anchor="start">CMD</text><text x="44" y="520" font-size="13" font-weight="800" fill="#1d4ed8" text-anchor="start">D0–D3</text><rect x="110" y="428" width="18" height="30" rx="4" fill="#f1f5f9" stroke="#475569"/><text x="119.0" y="448" font-size="11" font-weight="800" fill="#475569" text-anchor="middle">0</text><rect x="130" y="428" width="18" height="30" rx="4" fill="#f1f5f9" stroke="#475569"/><text x="139.0" y="448" font-size="11" font-weight="800" fill="#475569" text-anchor="middle">1</text><rect x="150" y="428" width="88" height="30" rx="4" fill="#fef3c7" stroke="#b45309"/><text x="194.0" y="448" font-size="11" font-weight="800" fill="#b45309" text-anchor="middle">índice 17</text><rect x="240" y="428" width="248" height="30" rx="4" fill="#dbeafe" stroke="#1d4ed8"/><text x="364.0" y="448" font-size="11" font-weight="800" fill="#1d4ed8" text-anchor="middle">endereço do bloco · 32 bits</text><rect x="490" y="428" width="58" height="30" rx="4" fill="#f1f5f9" stroke="#475569"/><text x="519.0" y="448" font-size="11" font-weight="800" fill="#475569" text-anchor="middle">CRC7</text><rect x="550" y="428" width="18" height="30" rx="4" fill="#f1f5f9" stroke="#475569"/><text x="559.0" y="448" font-size="11" font-weight="800" fill="#475569" text-anchor="middle">1</text><text x="340" y="478" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle">comando: 48 bits enviados pelo H743</text><rect x="590" y="428" width="150" height="30" rx="4" fill="#ede9fe" stroke="#7c3aed"/><text x="665" y="448" font-size="11" font-weight="800" fill="#7c3aed" text-anchor="middle">resposta R1 (48 bits)</text><text x="665" y="478" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">o cartão responde</text><rect x="200" y="502" width="48" height="30" rx="4" fill="#f1f5f9" stroke="#475569"/><text x="224.0" y="522" font-size="11" font-weight="800" fill="#475569" text-anchor="middle">start</text><rect x="250" y="502" width="498" height="30" rx="4" fill="#dbeafe" stroke="#1d4ed8"/><text x="499.0" y="522" font-size="11" font-weight="800" fill="#1d4ed8" text-anchor="middle">512 bytes = 1024 clocks com 4 linhas</text><rect x="750" y="502" width="128" height="30" rx="4" fill="#f1f5f9" stroke="#475569"/><text x="814.0" y="522" font-size="11" font-weight="800" fill="#475569" text-anchor="middle">CRC16 por linha</text><rect x="880" y="502" width="38" height="30" rx="4" fill="#f1f5f9" stroke="#475569"/><text x="899.0" y="522" font-size="11" font-weight="800" fill="#475569" text-anchor="middle">fim</text><text x="200" y="552" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="start">o bloco chega pelas 4 linhas de dados; o DMA copia direto para a RAM</text><text x="44" y="586" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">O cartão sempre lê e grava em blocos de 512 bytes. Sistemas de arquivos (FAT32, exFAT) são montados por cima, por uma biblioteca como a FatFs.</text><text x="24" y="628" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">3 · INICIALIZAÇÃO E VELOCIDADES</text>
<rect x="24" y="644" width="466" height="176" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="44" y="672" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">Etapa</text><text x="234" y="672" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">Clock</text><text x="344" y="672" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">Linhas</text><text x="44" y="696" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">identificação e endereço</text><text x="234" y="696" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">≤ 400 kHz</text><text x="344" y="696" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">1 (D0)</text><text x="44" y="720" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">Default Speed</text><text x="234" y="720" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">25 MHz</text><text x="344" y="720" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">4 · até 12,5 MB/s</text><text x="44" y="744" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">High Speed</text><text x="234" y="744" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">50 MHz</text><text x="344" y="744" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">4 · até 25 MB/s</text><text x="44" y="768" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">UHS-I (SDR50/104)</text><text x="234" y="768" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">100–208 MHz</text><text x="344" y="768" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">exige sinais de 1,8 V</text>
<text x="44" y="800" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="start">A placa trabalha só com 3,3 V: fica em Default ou High Speed.</text><rect x="510" y="644" width="466" height="176" rx="10" fill="#fffbeb" stroke="#f1d58a"/>
<text x="530" y="672" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">Cartão</text><text x="640" y="672" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">Capacidade</text><text x="780" y="672" font-size="12" font-weight="800" fill="#1e293b" text-anchor="start">Formato de fábrica</text><text x="530" y="696" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">SDSC</text><text x="640" y="696" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">até 2 GB</text><text x="780" y="696" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">FAT16</text><text x="530" y="720" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">SDHC</text><text x="640" y="720" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">4–32 GB</text><text x="780" y="720" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">FAT32</text><text x="530" y="744" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">SDXC</text><text x="640" y="744" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">64 GB–2 TB</text><text x="780" y="744" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start">exFAT</text>
<text x="530" y="772" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start">SDSC endereça em bytes; SDHC/SDXC, em blocos.</text><text x="530" y="792" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="start">Ative o exFAT na FatFs para cartões de 64 GB ou mais.</text><g transform="translate(24 838)"><rect width="952" height="86" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/><text x="18" y="27" font-size="14" font-weight="800" fill="#14532d" text-anchor="start">No STM32H743</text><text x="18" y="50" font-size="13" font-weight="400" fill="#1e293b" text-anchor="start">Dois SDMMC (SD 4.1, SDIO 4.0, eMMC 4.51 com 8 bits), até 125 MHz e DMA interno próprio. O DMA do SDMMC1 não alcança a DTCM:</text><text x="18" y="70" font-size="13" font-weight="400" fill="#1e293b" text-anchor="start">deixe os buffers na AXI SRAM (confira o manual RM0433). Um cartão por controlador.</text></g>
</svg>
