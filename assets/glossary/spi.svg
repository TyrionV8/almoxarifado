<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">SPI: ligação, modos e um byte trocado</title>
  <desc id="d">Ligação SPI com um controlador e dois periféricos, pinos da Flash SPI da WeAct H743, diagrama de tempo de um byte no modo 0 e tabela dos quatro modos CPOL/CPHA.</desc>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
  <rect width="1000" height="720" fill="#fff"/>
  <text x="24" y="34" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">1 · LIGAÇÃO: UM CONTROLADOR, VÁRIOS PERIFÉRICOS</text>
  <g transform="translate(24 50)">
<rect width="952" height="236" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="20" y="30" width="150" height="180" rx="8" fill="#0f3b2e"/>
<text x="95" y="112" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">H743 · SPI1</text>
<text x="95" y="132" font-size="11" fill="#bbf7d0" text-anchor="middle">controlador (master)</text>
<text x="95" y="148" font-size="11" fill="#bbf7d0" text-anchor="middle">gera o clock</text>
<rect x="690" y="14" width="230" height="98" rx="8" fill="#334155"/><text x="830" y="58" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">Flash SPI 8 MB</text><text x="830" y="78" font-size="11" fill="#cbd5e1" text-anchor="middle">PY25Q64HA · na placa</text><text x="698" y="36" font-size="10.5" font-weight="700" fill="#e2e8f0">SCK</text><text x="698" y="58" font-size="10.5" font-weight="700" fill="#e2e8f0">MOSI</text><text x="698" y="80" font-size="10.5" font-weight="700" fill="#e2e8f0">MISO</text><text x="698" y="102" font-size="10.5" font-weight="700" fill="#e2e8f0">CS</text>
<rect x="690" y="124" width="230" height="98" rx="8" fill="#475569"/><text x="830" y="168" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">outro periférico</text><text x="830" y="188" font-size="11" fill="#cbd5e1" text-anchor="middle">ex.: ADS1256, display</text><text x="698" y="146" font-size="10.5" font-weight="700" fill="#e2e8f0">SCK</text><text x="698" y="168" font-size="10.5" font-weight="700" fill="#e2e8f0">MOSI</text><text x="698" y="190" font-size="10.5" font-weight="700" fill="#e2e8f0">MISO</text><text x="698" y="212" font-size="10.5" font-weight="700" fill="#e2e8f0">CS</text>
<g font-size="12" font-weight="700" stroke-width="2.5" fill="none">
<path d="M170 56 H500 V138" stroke="#334155"/><path d="M500 28 V56" stroke="#334155"/><path d="M500 28 H688" stroke="#334155" marker-end="url(#ar)"/><path d="M500 138 H688" stroke="#334155" marker-end="url(#ar)"/><circle cx="500" cy="56" r="3.5" fill="#334155" stroke="none"/>
<text x="186" y="50" fill="#334155" stroke="none">SCK · PB3</text>
<path d="M170 86 H525 V160" stroke="#1d4ed8"/><path d="M525 50 V86" stroke="#1d4ed8"/><path d="M525 50 H688" stroke="#1d4ed8" marker-end="url(#ar)"/><path d="M525 160 H688" stroke="#1d4ed8" marker-end="url(#ar)"/><circle cx="525" cy="86" r="3.5" fill="#1d4ed8" stroke="none"/>
<text x="186" y="80" fill="#1d4ed8" stroke="none">MOSI · PD7 (controlador → periférico)</text>
<path d="M690 72 H550 V182 H690" stroke="#7c3aed"/><path d="M550 116 H172" stroke="#7c3aed" marker-end="url(#ar)"/><circle cx="550" cy="116" r="3.5" fill="#7c3aed" stroke="none"/>
<text x="186" y="110" fill="#7c3aed" stroke="none">MISO · PB4 (periférico → controlador)</text>
<path d="M170 156 H590 V94 H688" stroke="#b45309" marker-end="url(#ar)"/><text x="186" y="150" fill="#b45309" stroke="none">CS1 · PD6 (SB3) · ativo em baixo</text>
<path d="M170 196 H620 V204 H688" stroke="#b91c1c" marker-end="url(#ar)"/><text x="186" y="190" fill="#b91c1c" stroke="none">CS2 · outro GPIO livre</text>
</g></g>
  <text x="500" y="312" font-size="13.5" fill="#475569" text-anchor="middle">SCK, MOSI e MISO são compartilhados; cada periférico tem o seu CS. Só o selecionado (CS em nível baixo) responde em MISO.</text>

  <text x="24" y="356" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1.5">2 · UM BYTE NO MODO 0 (CPOL = 0, CPHA = 0)</text>
  <g transform="translate(24 372)">
    <g font-weight="700" fill="#334155" font-size="12.5"><text x="0" y="60">CS</text><text x="0" y="100">SCK</text><text x="0" y="140">MOSI</text><text x="0" y="180">MISO</text></g>
    <path d="M60 44 H80 V64 H430 V44 H470" fill="none" stroke="#0f172a" stroke-width="2"/>
    <path d="M60 104 H92" fill="none" stroke="#0f172a" stroke-width="2"/>
    <path d="M92 104 v-20 h20 v20 h20 v-20 h20 v20 h20 v-20 h20 v20 h20 v-20 h20 v20 h20 v-20 h20 v20 h20 v-20 h20 v20 h20 v-20 h20 v20 h20 v-20 h20 v20 h20 H470" fill="none" stroke="#0f172a" stroke-width="1.6"/>
    <line x1="112" y1="78" x2="112" y2="192" stroke="#16a34a" stroke-width="1" stroke-dasharray="2 3"/><line x1="152" y1="78" x2="152" y2="192" stroke="#16a34a" stroke-width="1" stroke-dasharray="2 3"/><line x1="192" y1="78" x2="192" y2="192" stroke="#16a34a" stroke-width="1" stroke-dasharray="2 3"/><line x1="232" y1="78" x2="232" y2="192" stroke="#16a34a" stroke-width="1" stroke-dasharray="2 3"/><line x1="272" y1="78" x2="272" y2="192" stroke="#16a34a" stroke-width="1" stroke-dasharray="2 3"/><line x1="312" y1="78" x2="312" y2="192" stroke="#16a34a" stroke-width="1" stroke-dasharray="2 3"/><line x1="352" y1="78" x2="352" y2="192" stroke="#16a34a" stroke-width="1" stroke-dasharray="2 3"/><line x1="392" y1="78" x2="392" y2="192" stroke="#16a34a" stroke-width="1" stroke-dasharray="2 3"/>
    <path d="M92 136 l4 -10 h32 l4 10 l-4 10 h-32z" stroke="#1d4ed8" fill="#dbeafe" stroke-width="1.6"/><text x="112" y="140" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">1</text><path d="M132 136 l4 -10 h32 l4 10 l-4 10 h-32z" stroke="#1d4ed8" fill="#dbeafe" stroke-width="1.6"/><text x="152" y="140" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">0</text><path d="M172 136 l4 -10 h32 l4 10 l-4 10 h-32z" stroke="#1d4ed8" fill="#dbeafe" stroke-width="1.6"/><text x="192" y="140" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">0</text><path d="M212 136 l4 -10 h32 l4 10 l-4 10 h-32z" stroke="#1d4ed8" fill="#dbeafe" stroke-width="1.6"/><text x="232" y="140" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">1</text><path d="M252 136 l4 -10 h32 l4 10 l-4 10 h-32z" stroke="#1d4ed8" fill="#dbeafe" stroke-width="1.6"/><text x="272" y="140" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">1</text><path d="M292 136 l4 -10 h32 l4 10 l-4 10 h-32z" stroke="#1d4ed8" fill="#dbeafe" stroke-width="1.6"/><text x="312" y="140" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">1</text><path d="M332 136 l4 -10 h32 l4 10 l-4 10 h-32z" stroke="#1d4ed8" fill="#dbeafe" stroke-width="1.6"/><text x="352" y="140" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">1</text><path d="M372 136 l4 -10 h32 l4 10 l-4 10 h-32z" stroke="#1d4ed8" fill="#dbeafe" stroke-width="1.6"/><text x="392" y="140" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">1</text>
    <path d="M92 176 l4 -10 h32 l4 10 l-4 10 h-32z" stroke="#7c3aed" fill="#ede9fe" stroke-width="1.6"/><text x="112" y="180" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">0</text><path d="M132 176 l4 -10 h32 l4 10 l-4 10 h-32z" stroke="#7c3aed" fill="#ede9fe" stroke-width="1.6"/><text x="152" y="180" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">0</text><path d="M172 176 l4 -10 h32 l4 10 l-4 10 h-32z" stroke="#7c3aed" fill="#ede9fe" stroke-width="1.6"/><text x="192" y="180" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">0</text><path d="M212 176 l4 -10 h32 l4 10 l-4 10 h-32z" stroke="#7c3aed" fill="#ede9fe" stroke-width="1.6"/><text x="232" y="180" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">0</text><path d="M252 176 l4 -10 h32 l4 10 l-4 10 h-32z" stroke="#7c3aed" fill="#ede9fe" stroke-width="1.6"/><text x="272" y="180" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">0</text><path d="M292 176 l4 -10 h32 l4 10 l-4 10 h-32z" stroke="#7c3aed" fill="#ede9fe" stroke-width="1.6"/><text x="312" y="180" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">0</text><path d="M332 176 l4 -10 h32 l4 10 l-4 10 h-32z" stroke="#7c3aed" fill="#ede9fe" stroke-width="1.6"/><text x="352" y="180" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">0</text><path d="M372 176 l4 -10 h32 l4 10 l-4 10 h-32z" stroke="#7c3aed" fill="#ede9fe" stroke-width="1.6"/><text x="392" y="180" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">0</text>
    <text x="92" y="214" font-size="11" font-weight="700" fill="#16a34a">linhas verdes = borda de subida: os dois lados leem o bit</text>
    <text x="92" y="232" font-size="11" fill="#475569">MOSI envia 9Fh (ler identificação); no mesmo clock,</text><text x="92" y="248" font-size="11" fill="#475569">MISO devolve um byte: SPI é full-duplex.</text>
    <g transform="translate(500 30)">
      <rect width="428" height="200" rx="10" fill="#fffbeb" stroke="#f1d58a"/>
      <text x="16" y="28" font-size="14" font-weight="800" fill="#1e293b">Os quatro modos</text>
      <g font-size="12.5" fill="#1e293b">
        <text x="16" y="56" font-weight="800">Modo</text><text x="80" y="56" font-weight="800">CPOL</text><text x="140" y="56" font-weight="800">CPHA</text><text x="200" y="56" font-weight="800">SCK parado · lê na borda</text>
        <text x="16" y="82">0</text><text x="80" y="82">0</text><text x="140" y="82">0</text><text x="200" y="82">baixo · subida</text>
        <text x="16" y="106">1</text><text x="80" y="106">0</text><text x="140" y="106">1</text><text x="200" y="106">baixo · descida</text>
        <text x="16" y="130">2</text><text x="80" y="130">1</text><text x="140" y="130">0</text><text x="200" y="130">alto · descida</text>
        <text x="16" y="154">3</text><text x="80" y="154">1</text><text x="140" y="154">1</text><text x="200" y="154">alto · subida</text>
      </g>
      <text x="16" y="184" font-size="11.5" fill="#92400e">Flash SPI aceita modo 0 ou 3; o ADS1256 usa modo 1.</text>
    </g>
  </g>

  <g transform="translate(24 626)">
    <rect width="952" height="80" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="18" y="27" font-size="14" font-weight="800" fill="#14532d">Para acertar a ligação</text>
    <text x="18" y="50" font-size="13" fill="#1e293b">Ligue MOSI→MOSI e MISO→MISO (não cruzar como no UART), una os GND e confira o nível lógico (3,3 V). Modo, ordem dos bits</text>
    <text x="18" y="68" font-size="13" fill="#1e293b">(MSB primeiro, o comum) e velocidade do clock precisam ser iguais nos dois lados. Para 4 linhas de dados em paralelo, veja QSPI.</text>
  </g>
</svg>
